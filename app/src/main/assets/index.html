<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a0e2e" />
<meta name="description" content="اکو پینت — یک پازل نقاشی که با پژواکِ دو ثانیه‌ای بین دو بخش صفحه بازی می‌شود." />
<title>ECHO PAINT | اکو پینت</title>
<style>
/* =====================================================================
   ECHO PAINT — سیستم طراحی
   پالت رنگی بر پایه دوگانگیِ مکانیک اصلی بازی است: آبی = بخش زنده (چپ)،
   طلایی = بخش پژواک (راست). پس‌زمینه یک فضای عمیقِ کهکشانی آبی-بنفش است
   که همهٔ نور و درخشش‌ها از دل آن بیرون می‌زنند.
   ===================================================================== */
:root{
  --void-1:#070a20;
  --void-2:#160f3c;
  --void-3:#33165f;
  --void-4:#5a2a86;
  --echo-blue:#54c8ff;
  --echo-blue-deep:#0f7bc4;
  --echo-blue-soft:rgba(84,200,255,0.14);
  --echo-gold:#ffd27a;
  --echo-gold-deep:#e2860f;
  --echo-gold-soft:rgba(255,210,122,0.14);
  --ink:#f3f1ff;
  --ink-soft:#b7b4d9;
  --ink-faint:#7e7aa8;
  --panel:rgba(15,12,36,0.66);
  --panel-edge:rgba(255,255,255,0.10);
  --danger:#ff6f7d;
  --success:#7bffb0;
  --r-lg:26px;
  --r-md:16px;
  --r-sm:10px;
  --font-main:'Vazirmatn','IRANSans','Segoe UI',Tahoma,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

.btn-vip{ background:linear-gradient(90deg, var(--echo-gold-deep), var(--echo-gold)); color:#241505; font-weight:700; }
.vip-overlay{ position:fixed; inset:0; z-index:999; display:none; align-items:center; justify-content:center; background:rgba(4,5,16,0.72); padding:24px; }
.vip-overlay.open{ display:flex; }
.vip-card{ width:100%; max-width:320px; background:var(--void-2); border:1px solid var(--panel-edge); border-radius:var(--r-lg); padding:22px; display:flex; flex-direction:column; gap:12px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
.vip-card h3{ color:var(--echo-gold); font-size:18px; }
.vip-card p{ color:var(--ink-soft); font-size:13px; line-height:1.7; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100%; overflow:hidden;
  background:var(--void-1); color:var(--ink);
  font-family:var(--font-main);
  -webkit-user-select:none; user-select:none;
  overscroll-behavior:none;
}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
h1,h2,h3,p{margin:0;}

#app{
  position:fixed; inset:0; width:100%; height:100%;
  touch-action:none;
}
#gameCanvas{
  position:absolute; inset:0; width:100%; height:100%;
  display:block; touch-action:none;
}

/* ===== نوارهای بالا و پایین (فقط هنگام بازی) ===== */
.hud{
  position:absolute; left:0; right:0;
  display:none; align-items:center; justify-content:space-between;
  padding:10px 16px; gap:10px; z-index:20;
}
#app[data-screen="playing"] .hud{ display:flex; }
.hud-top{
  top:0; padding-top:calc(10px + var(--safe-t));
  background:linear-gradient(to bottom, rgba(6,8,24,0.72), rgba(6,8,24,0));
}
.hud-bottom{
  bottom:0; padding-bottom:calc(12px + var(--safe-b));
  background:linear-gradient(to top, rgba(6,8,24,0.72), rgba(6,8,24,0));
}
.hud-center{ display:flex; flex-direction:column; align-items:center; gap:2px; }
#hudLevelLabel{ font-size:13.5px; color:var(--ink-soft); letter-spacing:.2px; }
#hudTimer{ font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink); }
.ink-gauge{ width:110px; height:5px; border-radius:4px; margin-top:4px; background:rgba(255,255,255,0.14); overflow:hidden; }
.ink-gauge-fill{ height:100%; width:100%; border-radius:4px; background:linear-gradient(90deg, var(--echo-blue), var(--echo-gold)); transition:width .12s linear, background .2s ease; }
.ink-gauge-fill.low{ background:var(--danger); }

/* ===== ستونِ اطلاعاتِ مرحله (پایین وسط صفحه): بجِ چرخش + نکتهٔ راهنما
   هر دو داخل یک ستونِ فلکسِ مشترک قرار دارند تا اندازه‌شان هرچه باشد
   (حتی وقتی متن‌شان چند خط می‌شود) هیچ‌وقت روی هم نیفتند. ===== */
/* پیش‌فرض این ستون بسته و نامرئی است تا وسطِ صفحه‌ی نقاشی نیفتد؛ فقط با
   زدنِ دکمه‌ی «آموزش مرحله» (کلاسِ open) نمایان می‌شود و با زدنِ دوباره
   یا رفتن به مرحله‌ی بعد، دوباره بسته می‌شود. */
.level-info-stack{
  position:absolute; left:50%; right:auto;
  bottom:calc(70px + var(--safe-b));
  transform:translateX(-50%);
  z-index:19; display:none; flex-direction:column; align-items:center; gap:6px;
  max-width:min(90%, 380px); width:max-content;
  pointer-events:none; /* هیچ‌وقت جلوی انگشتِ کشیدنِ روی بومِ زیرش را نگیرد */
}
#app[data-screen="playing"] .level-info-stack.open{ display:flex; }

.level-hint{
  display:flex; max-width:100%;
  align-items:center; justify-content:center; text-align:center;
  padding:7px 16px; border-radius:100px; gap:6px;
  background:var(--panel); border:1px solid var(--panel-edge);
  color:var(--ink-soft); font-size:11.5px; line-height:1.5;
  box-shadow:0 8px 22px rgba(0,0,0,0.28);
}

/* ===== نشانگر چرخشِ پژواک =====
   به‌جای یک خطِ انتزاعی، خودِ شکلِ واقعیِ نقطه‌چینِ سمتِ راست (با یک
   نقطهٔ سفیدِ چشمک‌زن روی نقطهٔ شروعش) داخلِ یک دایرهٔ کوچک قرار می‌گیرد
   و پیوسته و به‌آرامی می‌چرخد: از حالتِ فعلی‌اش شروع می‌کند، دقیقاً
   همان‌قدر که باید بچرخد می‌چرخد، یک لحظه همان‌جا می‌ایستد (تا بچه فرصت
   کند حالتِ نهایی را ببیند)، و برمی‌گردد. زیرِ آن هم به‌صراحت نوشته شده
   چند درجه و به کدام‌طرف. کارِ بازیکن این است: همان شکلِ چرخیده را که
   دید، با انگشتش در سمتِ چپ بکشد. */
.rotation-badge{
  display:none; max-width:100%; pointer-events:none;
  align-items:center; justify-content:center;
  padding:7px 16px 7px 10px; border-radius:100px; gap:10px;
  background:var(--echo-gold-soft); border:1px solid rgba(255,210,122,0.4);
  color:var(--echo-gold);
  box-shadow:0 6px 16px rgba(0,0,0,0.24);
}
.rotation-badge.show{ display:flex; }
.rotation-badge .rot-mini{ position:relative; width:42px; height:42px; flex-shrink:0; border-radius:50%; background:rgba(0,0,0,0.14); }
.rotation-badge .rot-mini-svg{ width:100%; height:100%; display:block; overflow:visible; }
.rotation-badge .rot-mini-group{ animation:rotHandCycle 2.8s ease-in-out infinite; }
.rotation-badge.crossed .rot-mini-group{ animation-name:rotHandCycleMirror; }
.rotation-badge.frozen .rot-mini-group{ animation-play-state:paused; }
.rotation-badge .rot-mini-path{
  fill:none; stroke:currentColor; stroke-width:0.05;
  stroke-linecap:round; stroke-linejoin:round; opacity:0.85;
}
.rotation-badge .rot-mini-startdot{ fill:#ffffff; animation:rotStartPulse 1.3s ease-in-out infinite; }
/* عقربه دیگر یک خط انتزاعی نیست: خودِ شکلِ واقعیِ نقطه‌چینِ سمتِ راست
   (با یک نقطهٔ سفیدِ چشمک‌زن روی محلِ شروعش) است که می‌چرخد — همان چیزی
   که بازیکن باید با انگشتش، چرخیده، در سمتِ چپ بکشد. */
@keyframes rotHandCycle{
  0%,10%{ transform: translate(0.5px,0.5px) rotate(0deg) translate(-0.5px,-0.5px); }
  45%,64%{ transform: translate(0.5px,0.5px) rotate(var(--target, 0deg)) translate(-0.5px,-0.5px); }
  97%,100%{ transform: translate(0.5px,0.5px) rotate(0deg) translate(-0.5px,-0.5px); }
}
/* برای مراحلِ آینه‌ای: شکل همیشه از توی آینه دیده می‌شود (mirror ثابت)
   و فقط بخشِ چرخش، مثلِ حالتِ عادی، رفت‌وبرگشت می‌کند. */
@keyframes rotHandCycleMirror{
  0%,10%{ transform: translate(0.5px,0.5px) rotate(0deg) scaleX(-1) translate(-0.5px,-0.5px); }
  45%,64%{ transform: translate(0.5px,0.5px) rotate(var(--target, 0deg)) scaleX(-1) translate(-0.5px,-0.5px); }
  97%,100%{ transform: translate(0.5px,0.5px) rotate(0deg) scaleX(-1) translate(-0.5px,-0.5px); }
}
@keyframes rotStartPulse{
  0%,100%{ opacity:0.45; r:0.045; }
  50%{ opacity:1; r:0.085; }
}
.rotation-badge .rot-line1{ font-size:12.5px; font-weight:700; line-height:1.5; white-space:normal; }

.icon-btn{
  width:42px; height:42px; border-radius:50%;
  background:var(--panel); border:1px solid var(--panel-edge);
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); transition:transform .12s ease, color .12s ease;
}
.icon-btn:active{ transform:scale(.88); color:var(--ink); }
.icon-btn svg{ width:20px; height:20px; }

.pill-btn{
  display:flex; align-items:center; gap:6px;
  padding:9px 13px; border-radius:100px;
  background:var(--panel); border:1px solid var(--panel-edge);
  color:var(--ink-soft); font-size:12.5px; white-space:nowrap;
  transition:transform .12s ease, color .12s ease, border-color .12s ease, background .12s ease;
}
.pill-btn:active{ transform:scale(.94); color:var(--ink); border-color:rgba(255,255,255,0.22); }
.pill-btn.active{ color:var(--echo-gold); border-color:rgba(255,210,122,0.4); background:var(--echo-gold-soft); }
.pill-btn svg{ width:16px; height:16px; flex-shrink:0; }
.hud-bottom{ gap:6px; }

/* ===== صفحات تمام‌صفحه (منو، انتخاب مرحله، دستاوردها) ===== */
.screen{
  position:absolute; inset:0; z-index:10;
  display:none; flex-direction:column; align-items:center;
  padding:calc(22px + var(--safe-t)) 22px calc(22px + var(--safe-b));
  overflow-y:auto;
}
#app[data-screen="menu"] .screen-menu{ display:flex; justify-content:center; }
#app[data-screen="levels"] .screen-levels{ display:flex; }
#app[data-screen="modes"] .screen-modes{ display:flex; }
#app[data-screen="achievements"] .screen-achievements{ display:flex; }

.title-block{ text-align:center; margin-bottom:38px; animation:riseIn .7s ease both; }
.game-title{
  font-size:44px; font-weight:800; letter-spacing:2px;
  line-height:1; direction:ltr;
}
.game-title .part-echo{ color:var(--echo-blue); text-shadow:0 0 22px rgba(84,200,255,0.55); }
.game-title .part-paint{ color:var(--echo-gold); text-shadow:0 0 22px rgba(255,210,122,0.55); }
.game-sub{ margin-top:10px; font-size:14.5px; color:var(--ink-soft); }

.menu-buttons{ display:flex; flex-direction:column; gap:13px; width:100%; max-width:300px; animation:riseIn .7s ease .08s both; }
.text-link{ margin-top:22px; font-size:12.5px; color:var(--ink-faint); text-decoration:underline; text-underline-offset:3px; }

.btn{
  padding:15px 20px; border-radius:100px; font-size:15.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{ transform:scale(.96); }
.btn-primary{
  background:linear-gradient(135deg, var(--echo-blue), var(--echo-gold));
  color:#0a0e2e; box-shadow:0 8px 26px rgba(84,200,255,0.28);
}
.btn-primary:active{ filter:brightness(.94); }
.btn-ghost{ background:var(--panel); border:1px solid var(--panel-edge); color:var(--ink); }
.btn-danger{ background:rgba(255,111,125,0.16); border:1px solid rgba(255,111,125,0.45); color:#ffb1ba; }

.screen-header{ width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.screen-header h2{ font-size:17px; font-weight:700; }

/* ===== شبکهٔ انتخاب مرحله ===== */
.level-grid{
  width:100%; max-width:520px;
  display:grid; grid-template-columns:repeat(5, 1fr); gap:12px;
  padding-bottom:20px;
}
.level-node{
  position:relative; aspect-ratio:1/1; border-radius:50%;
  background:var(--echo-blue-soft); border:1.6px solid rgba(84,200,255,0.4);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--ink); transition:transform .12s ease;
}
.level-node.crossed{ background:var(--echo-gold-soft); border-color:rgba(255,210,122,0.45); }
.level-node:active{ transform:scale(.92); }
.level-node.locked{ background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.10); color:var(--ink-faint); }
.lvl-num{ font-size:16px; font-weight:700; }
.lvl-stars{ display:flex; gap:1px; }
.ic-star{ width:11px; height:11px; color:var(--echo-gold); }
.ic-star.dim{ color:rgba(255,255,255,0.28); }
.ic-lock{ width:20px; height:20px; color:var(--ink-faint); }

/* ===== بازی‌های مختلف (مدل‌های بازی) ===== */
.mode-list{ width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px; }
.mode-card{
  width:100%; text-align:right; padding:17px 18px; border-radius:var(--r-md);
  background:var(--panel); border:1px solid var(--panel-edge);
  display:flex; flex-direction:column; gap:9px;
  transition:transform .12s ease, border-color .12s ease;
}
.mode-card:active{ transform:scale(.97); border-color:rgba(255,255,255,0.22); }
.mode-card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.mode-card-title{ font-size:15.5px; font-weight:700; }
.mode-card-sub{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
.mode-swatch{ width:36px; height:36px; border-radius:50%; flex-shrink:0; box-shadow:0 0 14px rgba(0,0,0,0.3) inset; }
.mode-card-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.85; }
.mode-card-progress{ font-size:11.5px; color:var(--ink-faint); }

/* ===== دستاوردها ===== */
.ach-list{ width:100%; max-width:520px; display:flex; flex-direction:column; gap:12px; }
.ach-card{
  display:flex; align-items:center; gap:14px; padding:16px;
  border-radius:var(--r-md); background:var(--panel); border:1px solid var(--panel-edge);
  opacity:.5; filter:grayscale(.6);
}
.ach-card.unlocked{ opacity:1; filter:none; border-color:rgba(255,210,122,0.35); }
.ach-badge{ width:46px; height:46px; border-radius:50%; background:rgba(255,210,122,0.12); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ic-trophy{ width:24px; height:24px; color:var(--echo-gold); }
.ach-title{ font-size:14.5px; font-weight:700; }
.ach-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

/* ===== مودال‌ها ===== */
.modal{
  position:absolute; inset:0; z-index:40; display:none;
  align-items:center; justify-content:center; padding:24px;
  padding-top:calc(24px + var(--safe-t)); padding-bottom:calc(24px + var(--safe-b));
  overflow-y:auto;
  background:rgba(4,6,18,0.58); backdrop-filter:blur(3px);
}
#app[data-modal="help"] #helpModal{ display:flex; }
#app[data-modal="pause"] .pause-modal{ display:flex; }
#app[data-modal="complete"] .complete-modal{ display:flex; }
#app[data-modal="confirm"] .confirm-modal{ display:flex; }

.panel{
  width:100%; max-width:360px; padding:26px 24px;
  max-height:100%; overflow-y:auto;
  border-radius:var(--r-lg); background:linear-gradient(180deg, rgba(24,18,54,0.92), rgba(15,12,36,0.92));
  border:1px solid var(--panel-edge);
  box-shadow:0 20px 60px rgba(0,0,0,0.45);
  animation:panelIn .28s cubic-bezier(.2,.9,.3,1.1) both;
  text-align:center;
}
.panel h2{ font-size:19px; font-weight:700; margin-bottom:14px; }
.panel p{ font-size:14px; color:var(--ink-soft); line-height:1.9; margin-bottom:18px; }
.panel .btn{ width:100%; margin-top:10px; }

/* راهنمای بازی می‌تواند طولانی شود (چند قدم توضیح)؛ برای اینکه دکمهٔ
   «متوجه شدم» همیشه در دسترس بماند و هیچ‌وقت زیرِ صفحه گم نشود، پنل
   خودش یک ستونِ فلکس است: فقط لیستِ قدم‌ها اسکرول می‌خورد، عنوان و
   دکمهٔ پایانی همیشه ثابت و قابل‌دیدن‌اند. */
.help-panel{
  text-align:right; max-height:min(78vh, 620px);
  display:flex; flex-direction:column;
}
.help-panel h2{ text-align:center; flex-shrink:0; }
.help-steps{
  display:flex; flex-direction:column; gap:14px; margin-bottom:16px;
  overflow-y:auto; flex:1 1 auto; min-height:0; padding-left:2px;
}
.help-panel .btn{ flex-shrink:0; }
.help-step{ display:flex; gap:12px; align-items:flex-start; }
.help-step .dot{ width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; background:var(--echo-blue-soft); color:var(--echo-blue); margin-top:1px; }
.help-step p{ margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.8; }

.complete-stars{ display:flex; justify-content:center; gap:8px; margin-bottom:10px; }
.complete-stars .ic-star{ width:30px; height:30px; }
.complete-accuracy{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
.complete-actions{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }

/* ===== نوتیفیکیشن دستاورد/راهنما ===== */
.toast{
  position:absolute; top:calc(14px + var(--safe-t)); left:16px; right:16px; z-index:60;
  display:flex; align-items:center; gap:12px; padding:13px 16px;
  border-radius:var(--r-md); background:linear-gradient(120deg, rgba(24,18,54,0.96), rgba(38,20,70,0.96));
  border:1px solid rgba(255,210,122,0.35);
  box-shadow:0 12px 34px rgba(0,0,0,0.4);
  transform:translateY(-140%); opacity:0; transition:transform .4s cubic-bezier(.2,.9,.3,1.1), opacity .4s ease;
  pointer-events:none;
}
.toast.show{ transform:translateY(0); opacity:1; }
.toast-icon{ width:34px; height:34px; border-radius:50%; background:rgba(255,210,122,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.toast-icon svg{ width:19px; height:19px; color:var(--echo-gold); }
.toast-title{ font-size:12px; color:var(--ink-soft); }
.toast-sub{ font-size:14px; font-weight:700; margin-top:1px; }

@keyframes riseIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
@keyframes panelIn{ from{opacity:0; transform:scale(.92) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);} }
@keyframes screenFadeIn{ from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes modalBackdropIn{ from{opacity:0;} to{opacity:1;} }
@keyframes starPop{
  0%{ opacity:0; transform:scale(.2) rotate(-25deg); }
  60%{ opacity:1; transform:scale(1.25) rotate(6deg); }

}

.level-node{ animation:riseIn .3s ease both; }

@media (max-width:340px){

<script>
(function(){
'use strict';

/* =====================================================================
   بخش ۱: توابع کمکی عمومی (Utils)
   ===================================================================== */
const clamp = (v,min,max) => Math.max(min, Math.min(max, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const dist  = (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1);
const nowMs = () => performance.now();

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n){ return String(n).replace(/[0-9]/g, d => FA_DIGITS[+d]); }

function fmtTime(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(s/60), r = s%60;
  return toFa((m<10?'0':'')+m) + ':' + toFa((r<10?'0':'')+r);
}

/* =====================================================================
   بخش ۲: سیستم ذخیره‌سازی امن (Safe Storage)
   در پیش‌نمایش artifact داخل claude.ai، دسترسی به localStorage ممکن است
   محدود یا مسدود باشد. این ماژول ابتدا localStorage را می‌آزماید و در
   صورت شکست، بی‌صدا به یک حافظهٔ موقت در RAM همان نشست سوییچ می‌کند تا
   بازی هرگز کرش نکند. وقتی این فایل به‌صورت APK یا یک صفحهٔ وب مستقل
   اجرا شود، localStorage به‌طور کامل و پایدار کار می‌کند و پیشرفت بازی
   بین اجراهای مختلف برنامه حفظ خواهد شد.
   ===================================================================== */
const SafeStorage = (function(){
  let memory = {};
  let useMemory = false;
  try{
    const k = '__echoPaintProbe__';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
  }catch(e){ useMemory = true; }
  return {
    get(key){
      if(useMemory) return (key in memory) ? memory[key] : null;
      try{ return window.localStorage.getItem(key); }
      catch(e){ return (key in memory) ? memory[key] : null; }
    },
    set(key, val){
      if(useMemory){ memory[key] = val; return; }
      try{ window.localStorage.setItem(key, val); }
      catch(e){ memory[key] = val; }
    }
  };
})();

/* =====================================================================
   بخش ۳: کتابخانهٔ تولید اشکال هندسی (Shape Generator Library)
   هر شکل آرایه‌ای از «حرکت‌ها» (strokes) است؛ هر حرکت خودش آرایه‌ای از
   نقاط نرمال‌شدهٔ {x,y} در بازهٔ صفر تا یک است، مستقل از اندازهٔ واقعی
   صفحه. این نقاط هنگام رسم به مختصات واقعیِ هر بخش (چپ/راست) و اندازهٔ
   واقعی صفحه تبدیل می‌شوند. حرکت‌های جدا از هم = تعداد ضربات لازم.
   ===================================================================== */

function genLine(angleDeg=0, length=0.7, cx=0.5, cy=0.5){
  const rad = angleDeg*Math.PI/180;
  const dx = Math.cos(rad)*length/2, dy = Math.sin(rad)*length/2;
  return [[{x:cx-dx,y:cy-dy},{x:cx+dx,y:cy+dy}]];
}

function genZigzag(segments=3, amplitude=0.16){
  const count = segments+1, pts=[];
  for(let i=0;i<count;i++){
    const t = i/(count-1);
    pts.push({x:0.16+0.68*t, y:0.5+((i%2===0)?-amplitude:amplitude)});
  }
  return [pts];
}

function genWave(cycles=2, amplitude=0.14){
  const steps = cycles*10, pts=[];
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    pts.push({x:0.15+0.7*t, y:0.5+Math.sin(t*Math.PI*2*cycles)*amplitude});
  }
  return [pts];
}

function genCircleApprox(steps=28, radius=0.3, cx=0.5, cy=0.5){
  const pts=[];
  for(let i=0;i<=steps;i++){
    const a = (i/steps)*Math.PI*2 - Math.PI/2;
    pts.push({x:cx+Math.cos(a)*radius, y:cy+Math.sin(a)*radius});
  }
  return [pts];
}

function genPolygon(sides=3, rotationDeg=-90, radius=0.32, cx=0.5, cy=0.5){
  const pts=[];
  for(let i=0;i<=sides;i++){
    const a = rotationDeg*Math.PI/180 + i*(2*Math.PI/sides);
    pts.push({x:cx+Math.cos(a)*radius, y:cy+Math.sin(a)*radius});
  }
  return [pts];
}

function genStarShape(points=5, outerR=0.34, innerR=0.14, rotationDeg=-90, cx=0.5, cy=0.5){
  const pts=[], total=points*2;
  for(let i=0;i<=total;i++){
    const r = (i%2===0) ? outerR : innerR;
    const a = rotationDeg*Math.PI/180 + i*(Math.PI/points);
    pts.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r});
  }
  return [pts];
}

function genHeart(){
  const pts=[], steps=32;
  for(let i=0;i<=steps;i++){
    const t = (i/steps)*Math.PI*2;
    const x16 = 16*Math.pow(Math.sin(t),3);
    const y16 = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    pts.push({x:0.5+x16/40, y:0.56-y16/40});
  }
  return [pts];
}

function genHouse(){
  return [
    [{x:0.26,y:0.55},{x:0.74,y:0.55},{x:0.74,y:0.84},{x:0.26,y:0.84},{x:0.26,y:0.55}],
    [{x:0.20,y:0.55},{x:0.5,y:0.24},{x:0.80,y:0.55}],
    [{x:0.44,y:0.84},{x:0.44,y:0.66},{x:0.56,y:0.66},{x:0.56,y:0.84}]
  ];
}
/* نسخهٔ دومِ خانه -- کمی پهن‌تر و با سقفی تیزتر از genHouse، به همان
   دلیلِ genArrowWide: تا مرحله‌ی «خانه»ی ساده و مرحله‌ی «خانه»ی متقاطع
   دو شکلِ کاملاً یکسان نباشند. */
function genHouseWide(){
  return [
    [{x:0.20,y:0.58},{x:0.80,y:0.58},{x:0.80,y:0.85},{x:0.20,y:0.85},{x:0.20,y:0.58}],
    [{x:0.13,y:0.58},{x:0.5,y:0.21},{x:0.87,y:0.58}],
    [{x:0.40,y:0.85},{x:0.40,y:0.68},{x:0.60,y:0.68},{x:0.60,y:0.85}]
  ];
}

function genArrow(){
  return [
    [{x:0.2,y:0.5},{x:0.68,y:0.5}],
    [{x:0.5,y:0.32},{x:0.74,y:0.5},{x:0.5,y:0.68}]
  ];
}
/* نسخهٔ دومِ پیکان -- بدنه‌ای بلندتر و نوکی بازتر از genArrow، تا دو
   مرحله‌ای که هردو «پیکان» هستند (یکی ساده، یکی متقاطع) هیچ‌وقت دقیقاً
   یک شکلِ پیکسل‌به‌پیکسل یکسان نباشند و بازی هیچ‌وقت مرحله‌ای تکراری
   نداشته باشد. */
function genArrowWide(){
  return [
    [{x:0.15,y:0.5},{x:0.72,y:0.5}],
    [{x:0.5,y:0.26},{x:0.8,y:0.5},{x:0.5,y:0.74}]
  ];
}

function genFlower(petals=5, len=0.28, cx=0.5, cy=0.5){
  const strokes=[];
  for(let i=0;i<petals;i++){
    const baseA = (i/petals)*Math.PI*2 - Math.PI/2;
    const m1 = baseA-0.4, m2 = baseA+0.4;
    const tip = {x:cx+Math.cos(baseA)*len, y:cy+Math.sin(baseA)*len};
    const c1  = {x:cx+Math.cos(m1)*len*0.62, y:cy+Math.sin(m1)*len*0.62};
    const c2  = {x:cx+Math.cos(m2)*len*0.62, y:cy+Math.sin(m2)*len*0.62};
    strokes.push([{x:cx,y:cy}, c1, tip, c2, {x:cx,y:cy}]);
  }
  return strokes;
}

function genSpiral(turns=2, maxRadius=0.32, cx=0.5, cy=0.5){
  const steps = Math.round(turns*16), pts=[];
  for(let i=0;i<=steps;i++){
    const t = i/steps, a = t*Math.PI*2*turns, r = t*maxRadius;
    pts.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r});
  }
  return [pts];
}

function genBoat(){
  return [
    [{x:0.18,y:0.62},{x:0.82,y:0.62},{x:0.66,y:0.8},{x:0.34,y:0.8},{x:0.18,y:0.62}],
    [{x:0.5,y:0.62},{x:0.5,y:0.2}],
    [{x:0.5,y:0.23},{x:0.73,y:0.5},{x:0.5,y:0.5}]
  ];
}

function genSunburst(rays=6, coreR=0.16, rayLen=0.17){
  const strokes = [genCircleApprox(24,coreR)[0]];
  for(let i=0;i<rays;i++){
    const a = (i/rays)*Math.PI*2;
    strokes.push([
      {x:0.5+Math.cos(a)*coreR, y:0.5+Math.sin(a)*coreR},
      {x:0.5+Math.cos(a)*(coreR+rayLen), y:0.5+Math.sin(a)*(coreR+rayLen)}
    ]);
  }
  return strokes;
}

function genLightningBolt(){
  return [[
    {x:0.56,y:0.14},{x:0.36,y:0.48},{x:0.53,y:0.48},{x:0.36,y:0.86},
    {x:0.68,y:0.4},{x:0.5,y:0.4},{x:0.56,y:0.14}
  ]];
}

function genCloud(){
  const pts=[];
  for(let i=0;i<=24;i++){
    const t = i/24;
    pts.push({x:0.18+0.64*t, y:0.56-Math.sin(t*Math.PI)*0.19-Math.sin(t*Math.PI*3)*0.035});
  }
  return [pts];
}

function genConstellation(strokeCount=4, segPerStroke=3, seed=1){
  const rnd = mulberry32(seed), strokes=[];
  for(let s=0;s<strokeCount;s++){
    let cx = 0.18+rnd()*0.64, cy = 0.18+rnd()*0.64;
    const pts=[{x:cx,y:cy}];
    for(let i=0;i<segPerStroke;i++){
      cx = clamp(cx+(rnd()-0.5)*0.38, 0.08,0.92);
      cy = clamp(cy+(rnd()-0.5)*0.38, 0.08,0.92);
      pts.push({x:cx,y:cy});
    }
    strokes.push(pts);
  }
  return strokes;
}

/* ابزارهای ترکیب، انتقال، تغییر اندازه و آینه‌کردنِ اشکال */
function translateShape(strokes, dx, dy){
  return strokes.map(s => s.map(p => ({x:p.x+dx, y:p.y+dy})));
}
function scaleShape(strokes, s, cx=0.5, cy=0.5){
  return strokes.map(st => st.map(p => ({x:cx+(p.x-cx)*s, y:cy+(p.y-cy)*s})));
}
function mirrorShapeX(strokes){
  return strokes.map(s => s.map(p => ({x:1-p.x, y:p.y})));
}
function rotatePoint(p, angleDeg, cx=0.5, cy=0.5){
  const rad = angleDeg*Math.PI/180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const dx = p.x-cx, dy = p.y-cy;
  return { x: cx + dx*cos - dy*sin, y: cy + dx*sin + dy*cos };
}
function rotateShape(strokes, angleDeg){
  return strokes.map(s => s.map(p => rotatePoint(p, angleDeg)));
}
function mergeShapes(...shapeArrays){
  return [].concat(...shapeArrays);
}
/* شکل‌هایی که پارامتر cx/cy مستقیم ندارند (خانه، قایق، ابر، رعد...) را
   حول مرکز ۰.۵،۰.۵ کوچک/بزرگ می‌کند و بعد به مرکزِ دلخواه منتقل می‌کند؛
   برای چیدنِ چند شکلِ متفاوت کنارِ هم بدونِ برخوردِ زیاد به‌کار می‌رود. */
function placeShape(shape, scale, cx, cy){
  return translateShape(scaleShape(shape, scale, 0.5, 0.5), cx-0.5, cy-0.5);
}
function pathLength(strokes){
  let total=0;
  strokes.forEach(st=>{ for(let i=1;i<st.length;i++) total += dist(st[i-1].x,st[i-1].y,st[i].x,st[i].y); });
  return total;
}
function strokeLength(st){
  let total=0; for(let i=1;i<st.length;i++) total += dist(st[i-1].x,st[i-1].y,st[i].x,st[i].y);
  return total;
}
/* نمونه‌برداریِ یکنواخت از یک ضربه با تعداد نقطهٔ دلخواه (برای «شکار نقطه‌ها») */
function sampleEvenly(stroke, count){
  if(count<=1 || stroke.length===1) return [stroke[0]];
  const lens=[0];
  for(let i=1;i<stroke.length;i++) lens.push(lens[i-1]+dist(stroke[i-1].x,stroke[i-1].y,stroke[i].x,stroke[i].y));
  const total = lens[lens.length-1];
  const out=[];
  if(total===0){ for(let i=0;i<count;i++) out.push(stroke[0]); return out; }
  for(let i=0;i<count;i++){
    const target = total*(i/(count-1));
    let seg=0; while(seg<lens.length-2 && lens[seg+1]<target) seg++;
    const segLen = lens[seg+1]-lens[seg];
    const localT = segLen>0 ? (target-lens[seg])/segLen : 0;
    out.push({ x: lerp(stroke[seg].x, stroke[seg+1].x, localT), y: lerp(stroke[seg].y, stroke[seg+1].y, localT) });
  }
  return out;
}
/* نمونه‌برداریِ چگال با فاصلهٔ ثابت (برای حرکتِ نرمِ «ردِ نور») */
function resampleBySpacing(stroke, spacing){
  const len = strokeLength(stroke);
  const count = Math.max(2, Math.round(len/spacing)+1);
  return sampleEvenly(stroke, count);
}

      const t1 = timeMs*freq;
      const gust = 0.5+0.5*Math.sin(timeMs*freq*0.31 + si*2.1);
      const swayX = Math.sin(t1*2.0 + phase) * amp * anchorFactor * (0.5+1.1*gust);
      const swayY = Math.cos(t1*1.3 + phase*0.7) * amp * 0.55 * anchorFactor * (0.5+1.1*gust);
      return { x: clamp(p.x+swayX, 0, 1), y: clamp(p.y+swayY, 0, 1) };
    });
  });
}

function buildLevels(modeDef){
  const levelsArr = modeDef.levels;
  const n = levelsArr.length;
  return levelsArr.map((lv, idx)=>{
    const t = idx/(n-1);
    const strokesRequired = lv.shape.length;
    const totalLen = pathLength(lv.shape);
    const base = {
      index: idx,
      name: lv.name,
      shape: lv.shape,
      strokesRequired,
      totalLen
    };

    if(modeDef.kind==='echo'){
      const tolerance = lerp(0.1, 0.045, t);
      const slack = lerp(1.75, 1.05, t);
      const parTimeMs = Math.round(2200 + strokesRequired*950 + totalLen*3400*slack);
      const rotation = modeDef.rotationFor(idx);
      const crossed = modeDef.crossedFor(idx, lv.crossed);
      const rightGuide = crossed ? mirrorShapeX(lv.shape) : lv.shape;
      return Object.assign(base, {
        crossed, rotation, rightGuide,
        leftTarget: rotateShape(lv.shape, -rotation),
        tolerance, parTimeMs,
        inkBudget: totalLen*INK_BUDGET_MULTIPLIER,
        echoDelayMs: modeDef.delay(idx, n),
        rotationInvariant: !!lv.rotationInvariant
      });
    }

    if(modeDef.kind==='memory'){
      const tolerance = lerp(0.13, 0.06, t);
      const slack = lerp(1.9, 1.2, t);
      const parTimeMs = Math.round(2600 + strokesRequired*1000 + totalLen*3700*slack);
      const memorizeMs = Math.round(lerp(3400, 1500, t) + strokesRequired*220);
      return Object.assign(base, {
        tolerance, parTimeMs,
        inkBudget: totalLen*1.3,
        memorizeMs
      });
    }

    if(modeDef.kind==='dots'){
      const dotToleranceR = lerp(0.09, 0.05, t);
      /* منحنیِ سرعتِ بین مرحله‌ها تندتر شد (قبلاً تا ۷۸۰ میلی‌ثانیه پایین
         می‌آمد، حالا تا ۵۲۰) و با تواندارِ t*t جلو می‌رود، یعنی مراحلِ
         پایانی خیلی سریع‌تر از قبل حس می‌شوند -- دقیقاً مثلِ یک «حالتِ
         سرعتی». */
      const perDotMs = Math.round(lerp(1500, 520, t*t));
      const targetDots = Math.round(lerp(7, 17, t));
      const perStroke = Math.max(2, Math.round(targetDots/strokesRequired));
      const dotGroups = lv.shape.map(st => sampleEvenly(st, perStroke));
      const dotsPoints = [].concat(...dotGroups);
      /* علاوه بر تندترشدنِ سرعت از مرحله‌ای به مرحله‌ی دیگر، حالا خودِ
         نقطه‌های داخلِ یک مرحله هم پیوسته تندتر می‌شوند: اولین نقطه با
         سرعتِ کاملِ perDotMs شروع می‌شود و آخرین نقطه‌ی همان مرحله تا
         نصفِ آن زمان (perDotMs*DOTS_INTRA_LEVEL_SPEEDUP_FLOOR) می‌رسد --
         همان حسِ «هرچه جلوتر، سریع‌تر» که در حالت سرعتی هست. */
      let totalDotsDuration = 0;
      const floorMs = perDotMs*DOTS_INTRA_LEVEL_SPEEDUP_FLOOR;
      dotsPoints.forEach((_,i)=>{
        const rampT = dotsPoints.length>1 ? i/(dotsPoints.length-1) : 0;
        totalDotsDuration += lerp(perDotMs, floorMs, rampT);
      });
      return Object.assign(base, {
        dotGroups, dotsPoints,
        dotToleranceR, perDotMs,
        parTimeMs: Math.round(totalDotsDuration)
      });
    }

    if(modeDef.kind==='duo'){
      /* هر مرحله دو شکلِ متفاوت از همان ۴۰ شکلِ پایه را کنارِ هم قرار
         می‌دهد (با افستِ ثابتِ ۵، که چون بر ۴۰ بخش‌پذیر است ولی خودِ ۴۰
         نیست، همیشه شکلی غیرِ خودِ idx را نتیجه می‌دهد) — یکی برای دستِ
         چپ، یکی برای دستِ راست، کاملاً بی‌ربط به هم. */
      const pairIdx = (idx+5) % n;
      const leftShape = lv.shape;
      const rightShape = levelsArr[pairIdx].shape;
      const tolerance = lerp(0.11, 0.05, t);
      const slack = lerp(1.9, 1.15, t);
      const leftLen = pathLength(leftShape), rightLen = pathLength(rightShape);
      const leftStrokesRequired = leftShape.length, rightStrokesRequired = rightShape.length;
      const parTimeMs = Math.round(2800 + (leftStrokesRequired+rightStrokesRequired)*900 + (leftLen+rightLen)*3200*slack);
      return Object.assign(base, {
        name: 'دو دست، دو شکلِ هم‌زمان — مرحلهٔ '+toFa(idx+1),
        leftShape, rightShape, leftStrokesRequired, rightStrokesRequired,
        tolerance, parTimeMs,
        /* هر دست جوهرِ مستقلِ خودش را دارد -- وگرنه با تک‌تک‌زدن روی
           هرکدام از دو طرف (بدونِ هیچ محدودیتی، چون این حالت هیچ‌وقت
           سقفِ جوهر نداشت) می‌شد بدونِ کشیدنِ خطِ واقعی برد -- دقیقاً
           همان باگی که در حالت‌های دیگر پیدا و بسته شد. */
        leftInkBudget: leftLen*INK_BUDGET_MULTIPLIER,
        rightInkBudget: rightLen*INK_BUDGET_MULTIPLIER
      });
    }

    if(modeDef.kind==='trail'){
      const spacing = 0.014;
      const trailStrokes = lv.shape.map(st => resampleBySpacing(st, spacing));
      const speedPerMs = lerp(0.00015, 0.00032, t);
      const toleranceR = lerp(0.11, 0.055, t);
      let totalDuration = 0;
      const segDurations = trailStrokes.map(st => {
        const len = strokeLength(st);
        const d = len/speedPerMs;
        totalDuration += d + (trailStrokes.length>1 ? TRAIL_STROKE_GAP_MS : 0);
        return d;
      });
      return Object.assign(base, {
        trailStrokes, segDurations, toleranceR,
        totalDuration
      });
    }

    if(modeDef.kind==='chain'){
      /* هر خطِ شکل، جدا از بقیه، یک بار به‌تنهایی ارزیابی می‌شود (نه
         فقط در پایان، در کنارِ همه‌ی خط‌های دیگر)، پس آستانهٔ فاصله
         باید کمی بازتر از حالتِ کلاسیک باشد وگرنه رد کردنِ تک‌تکِ
         خط‌ها خیلی سخت می‌شود. */
      const tolerance = lerp(0.12, 0.06, t);
      const slack = lerp(2.0, 1.25, t);
      const parTimeMs = Math.round(2400 + strokesRequired*1250 + totalLen*3600*slack);
      return Object.assign(base, {
        tolerance, parTimeMs,
        inkBudget: totalLen*1.5
      });
    }

    if(modeDef.kind==='fill'){
      /* هرچه مرحله جلوتر برود، هم باید سهمِ بیشتری از سایه رنگ بخورد
         (coverageTarget بالاتر می‌رود)، هم قلم‌مو ریزتر می‌شود
         (brushR کوچک‌تر می‌شود -- در مراحلِ اول یک قلم‌موی چاق داری
         که به‌سرعت پر می‌کند، در مراحلِ آخر باید واقعاً داخلِ خطوط
         بمانی)، و هم سقفِ مجازِ بیرون‌زدگی برای گرفتنِ ستارهٔ «تمیزی»
         تنگ‌تر می‌شود. زمانِ استانداردِ رسیدن به آن هم متناسب با طول
         واقعیِ مسیرِ شکل حساب می‌شود. خودِ ناحیهٔ رنگ‌پذیر (fillMask)
         اینجا ساخته نمی‌شود -- چون به یک بومِ موقتِ Canvas نیاز دارد --
         و فقط اولین‌بار که این مرحله واقعاً بازی می‌شود، تنبل (lazy)
         ساخته و روی خودِ مرحله کش می‌شود. */
      const coverageTarget = lerp(0.72, 0.9, t);
      const parTimeMs = Math.round(2800 + totalLen*4200 + strokesRequired*650);
      const brushR = lerp(0.062, 0.03, t);
      const maxCleanOverflow = lerp(0.24, 0.11, t);
      return Object.assign(base, {
        coverageTarget, parTimeMs, brushR, maxCleanOverflow
      });
    }

    if(modeDef.kind==='wind'){
      const tolerance = lerp(0.12, 0.06, t);
      const slack = lerp(2.0, 1.3, t);
      const parTimeMs = Math.round(2600 + strokesRequired*1000 + totalLen*3600*slack);
      const windAmp = lerp(0.032, 0.11, t);
      const windFreq = lerp(0.0012, 0.0027, t);
      return Object.assign(base, {
        tolerance, parTimeMs,
        inkBudget: totalLen*1.4,
        windAmp, windFreq
      });
    }

    if(modeDef.kind==='nolift' || modeDef.kind==='noretrace'){
      /* چون بازیکن اجازه ندارد بینِ تکه‌های مختلفِ شکل انگشتش را بردارد،
         باید فاصلهٔ بینِ پایانِ هر تکه و شروعِ تکهٔ بعدی را هم با خط
         وصل کند -- این فاصله («رابط‌ها») نه جزوِ شکلِ اصلی حساب می‌شود
         و نه امتیازدهی می‌گیرد، ولی از سقفِ جوهر کم می‌شود؛ به همین
         خاطر جوهرِ این دو مدل از بقیه بیشتر است. */
      let connectorLen = 0;
      for(let i=1;i<lv.shape.length;i++){
        const prevStroke = lv.shape[i-1], curStroke = lv.shape[i];
        const p1 = prevStroke[prevStroke.length-1], p2 = curStroke[0];
        connectorLen += dist(p1.x,p1.y,p2.x,p2.y);
      }
      const tolerance = lerp(0.115, 0.055, t);
      const slack = lerp(2.1, 1.4, t);
      const parTimeMs = Math.round(3000 + strokesRequired*700 + (totalLen+connectorLen)*3900*slack);
      const extra = {
        tolerance, parTimeMs,
        inkBudget: (totalLen+connectorLen)*1.65,
        connectorLen
      };
      if(modeDef.kind==='noretrace') extra.retraceTolerance = lerp(0.05, 0.03, t);
      return Object.assign(base, extra);
    }

    return base;
  });
}
const TRAIL_STROKE_GAP_MS = 260;
/* حداقلِ نسبیِ زمانِ هر نقطه در «شکار نقطه‌ها»، نسبت به سرعتِ شروعِ همان
   مرحله (رجوع کنید به buildLevels و dotDurationFor). یعنی آخرین نقطهٔ هر
   مرحله حداکثر تا نصفِ سرعتِ اولین نقطه‌اش تند می‌شود. */
const DOTS_INTRA_LEVEL_SPEEDUP_FLOOR = 0.5;
/* زمانِ واقعیِ مجازِ برای نقطه‌ی idx‌ام از یک مرحله؛ هرچه idx بزرگ‌تر
   (یعنی هرچه بازیکن جلوتر رفته)، این عدد کوچک‌تر و بازی تندتر می‌شود. */
function dotDurationFor(lvl, idx){
  const total = lvl.dotsPoints.length;
  const rampT = total>1 ? idx/(total-1) : 0;
  return Math.round(lerp(lvl.perDotMs, lvl.perDotMs*DOTS_INTRA_LEVEL_SPEEDUP_FLOOR, rampT));
}

/* =====================================================================
   بخش ۵c: «رنگ‌آمیزیِ سایه» -- ساختِ ماسکِ ناحیهٔ رنگ‌پذیر
   برای هر شکل، یک شبکهٔ کوچک (۴۲×۴۲) می‌سازیم: هر خانه یا «داخلِ
   سایه» است یا نه. برای شکل‌های بسته (قلب، ستاره، دایره...) این با
   رسمِ خودِ خط‌ها روی یک بومِ موقت و پرکردنِ آن (fill) به‌دست می‌آید.
   برای شکل‌های باز (یک خط ساده، زیگزاگ...) که ناحیهٔ محصورِ چندانی
   ندارند، یک نوارِ نازک هم دورِ خودِ مسیر اضافه می‌شود تا آن مرحله هم
   قابل‌رنگ‌آمیزی بماند -- اینجا رنگ‌آمیزی یعنی «پرکردنِ یک ردِ پهن».
   ===================================================================== */
const FILL_MASK_RES = 42;
const FILL_RIBBON_R = 0.05;
function buildFillMaskFromShape(shape){
  const off = document.createElement('canvas');
  off.width = FILL_MASK_RES; off.height = FILL_MASK_RES;
  const octx = off.getContext('2d');
  octx.fillStyle = '#fff';
  octx.beginPath();
  shape.forEach(stroke=>{
    if(!stroke.length) return;
    stroke.forEach((p,i)=>{
      const x = p.x*FILL_MASK_RES, y = p.y*FILL_MASK_RES;
      if(i===0) octx.moveTo(x,y); else octx.lineTo(x,y);
    });
  });
  octx.fill('nonzero');
  const data = octx.getImageData(0,0,FILL_MASK_RES,FILL_MASK_RES).data;
  const mask = new Uint8Array(FILL_MASK_RES*FILL_MASK_RES);
  for(let i=0;i<mask.length;i++){ if(data[i*4+3] > 10) mask[i] = 1; }

  const dense = [];
  shape.forEach(st=>{
    if(st.length===1){ dense.push(st[0]); return; }
    for(let i=0;i<st.length-1;i++){
      const a=st[i], b=st[i+1];
      const segLen = dist(a.x,a.y,b.x,b.y);
      const steps = Math.max(1, Math.ceil(segLen/0.02));
      for(let s=0;s<=steps;s++) dense.push({x:lerp(a.x,b.x,s/steps), y:lerp(a.y,b.y,s/steps)});
    }
  });
  for(let gy=0; gy<FILL_MASK_RES; gy++){
    for(let gx=0; gx<FILL_MASK_RES; gx++){
      const idx = gy*FILL_MASK_RES+gx;
      if(mask[idx]) continue;
      const cx=(gx+0.5)/FILL_MASK_RES, cy=(gy+0.5)/FILL_MASK_RES;
      for(let k=0;k<dense.length;k++){
        const dp = dense[k];
        if(Math.abs(dp.x-cx)>FILL_RIBBON_R || Math.abs(dp.y-cy)>FILL_RIBBON_R) continue;
        if(dist(cx,cy,dp.x,dp.y)<=FILL_RIBBON_R){ mask[idx]=1; break; }
      }
    }
  }
  let insideCount = 0;
  for(let i=0;i<mask.length;i++) insideCount += mask[i];
  return { res:FILL_MASK_RES, mask, insideCount: Math.max(insideCount,1) };
}
function getFillMask(lvl){
  if(!lvl.fillMask) lvl.fillMask = buildFillMaskFromShape(lvl.shape);
  return lvl.fillMask;
}
/* شعاعِ قلم‌مو دیگر ثابت نیست: هرچه مرحله جلوتر برود، قلم‌مو ریزتر
   می‌شود (رجوع کنید به lvl.brushR در buildLevels) و پوشاندنِ کامل‌ِ
   سایه به دقتِ واقعی نیاز پیدا می‌کند، نه فقط چند خط‌خطیِ سریع. مقدارِ
   پیش‌فرض اینجا فقط برای جاهایی است که مرحله در دسترس نیست. */
const FILL_BRUSH_R_DEFAULT = 0.05;
function stampFillBrush(cx, cy, fillMask, fillState, brushR){
  const r = brushR || FILL_BRUSH_R_DEFAULT;
  const res = fillMask.res;
  const rCells = Math.max(1, Math.ceil(r*res));
  const gx0 = Math.floor(cx*res), gy0 = Math.floor(cy*res);
  for(let gy=gy0-rCells; gy<=gy0+rCells; gy++){
    if(gy<0||gy>=res) continue;
    for(let gx=gx0-rCells; gx<=gx0+rCells; gx++){
      if(gx<0||gx>=res) continue;
      const ccx=(gx+0.5)/res, ccy=(gy+0.5)/res;
      if(dist(cx,cy,ccx,ccy) > r) continue;
      const idx = gy*res+gx;
      if(fillState.paintGrid[idx]) continue;
      fillState.paintGrid[idx] = 1;
      if(fillMask.mask[idx]) fillState.paintedInsideCount++;
      else fillState.paintedOutsideCount++;
    }
  }
}

const LEVELS_BY_MODE = {};
MODE_DEFS.forEach(m=>{ LEVELS_BY_MODE[m.id] = buildLevels(m); });
function modeDefById(id){ return MODE_DEFS.find(m=>m.id===id) || MODE_DEFS[0]; }
let currentModeId = 'classic';
function getLevels(){ return LEVELS_BY_MODE[currentModeId]; }
function modeKind(){ return modeDefById(currentModeId).kind; }

/* =====================================================================
   بخش ۵: سیستم صدای رویه‌ای (Procedural Audio)
   به‌جای فایل‌های صوتیِ خارجی (که برای بستهٔ آفلاینِ APK قابل‌اتکا
   نیستند)، افکت‌های صوتی کوتاه به‌کمک Web Audio API و در لحظه تولید
   می‌شوند. AudioContext تا اولین تعامل کاربر ساخته نمی‌شود تا با
   سیاست‌های autoplay مرورگر/سیستم‌عامل تداخل نداشته باشد.
   ===================================================================== */
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return audioCtx;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ audioCtx = null; }
  return audioCtx;
}
function playTone(freq, durationMs, type='sine', peak=0.16, delayMs=0){
  if(!GameData.soundOn) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  if(ctx.state==='suspended'){ ctx.resume().catch(()=>{}); }
  const t0 = ctx.currentTime + delayMs/1000;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+durationMs/1000);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+durationMs/1000+0.03);
}
/* لرزشِ ظریفِ گوشی (Vibration API) برای رویدادهای مهمِ بازی -- مستقل
   از سوییچِ صدا، چون خیلی از بازیکن‌ها صدا را خاموش می‌کنند ولی هنوز
   از لمسِ فیزیکیِ فیدبک لذت می‌برند. روی مرورگرهایی که پشتیبانی
   نمی‌کنند (مثل سافاری iOS) بی‌صدا نادیده گرفته می‌شود. */
function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
const SFX = {
  tap(){ playTone(560,80,'sine',0.11); },
  strokeStart(){ playTone(680,70,'triangle',0.09); vibrate(8); },
  echoLand(){ playTone(340,150,'sine',0.13); vibrate(12); },
  inkOut(){ playTone(220,140,'sawtooth',0.10); playTone(160,180,'sawtooth',0.09,80); vibrate([0,30,40,30]); },
  levelComplete(){ [523,659,784,1046].forEach((f,i)=>playTone(f,260,'triangle',0.15,i*80)); vibrate([0,14,50,14,50,60]); },
  achievement(){ [660,880,1108].forEach((f,i)=>playTone(f,320,'sine',0.17,i*110)); vibrate([0,10,40,10,40,10,90]); },
  restart(){ playTone(210,90,'sawtooth',0.10); playTone(150,140,'sawtooth',0.09,70); vibrate([0,22,26,22]); }
};

/* =====================================================================
   بخش ۶: دادهٔ پیشرفت بازیکن (Save Data) و وضعیت کلی بازی
   ===================================================================== */
const SAVE_KEY = 'echoPaint_save_v1';

function defaultGameData(){
  const modes = {};
  MODE_DEFS.forEach(m=>{ modes[m.id] = { unlockedCount:1, stars:new Array(RAW_LEVELS.length).fill(0), seenIntro:false }; });
  return {
    modes,
    achievements: { beginner:false, delayMaster:false, coordinator:false },
    soundOn: true,
    seenTutorial: false,
    seenCrossedIntro: false
  };
}
function loadGameData(){
  const raw = SafeStorage.get(SAVE_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      const base = defaultGameData();
      if(parsed.modes){
        Object.keys(base.modes).forEach(id=>{
          const pm = parsed.modes[id];
          if(pm){
            base.modes[id].unlockedCount = pm.unlockedCount||1;
            if(Array.isArray(pm.stars) && pm.stars.length===RAW_LEVELS.length) base.modes[id].stars = pm.stars;
            base.modes[id].seenIntro = !!pm.seenIntro || (id==='classic' && !!parsed.seenTutorial);
          }
        });
      } else if(Array.isArray(parsed.stars)){
        /* دادهٔ ذخیره‌شدهٔ نسخهٔ قدیمی (پیش از افزودنِ مدل‌های بازی)؛
           پیشرفتِ آن را به‌عنوانِ پیشرفتِ حالتِ کلاسیک منتقل می‌کنیم. */
        base.modes.classic.unlockedCount = parsed.unlockedCount||1;
        if(parsed.stars.length===RAW_LEVELS.length) base.modes.classic.stars = parsed.stars;
      }
      base.achievements = Object.assign(base.achievements, parsed.achievements||{});
      base.soundOn = (typeof parsed.soundOn==='boolean') ? parsed.soundOn : true;
      base.seenTutorial = !!parsed.seenTutorial;
      base.seenCrossedIntro = !!parsed.seenCrossedIntro;
      return base;
    }catch(e){ /* دادهٔ ذخیره‌شده خراب بود؛ از حالت پیش‌فرض استفاده می‌کنیم */ }
  }
  return defaultGameData();
}
function saveGameData(){ SafeStorage.set(SAVE_KEY, JSON.stringify(GameData)); }

let GameData = loadGameData();

const SCREEN = { MENU:'menu', LEVELS:'levels', MODES:'modes', ACHIEVEMENTS:'achievements', PLAYING:'playing' };
let levelSelectOrigin = 'menu';
const MODAL  = { NONE:null, HELP:'help', PAUSE:'pause', COMPLETE:'complete', CONFIRM:'confirm' };
let currentScreen = SCREEN.MENU;
let activeModal = MODAL.NONE;
let currentLevelIndex = 0;
let attempt = null;

function currentLevel(){ return getLevels()[currentLevelIndex]; }

function makeAttempt(levelIndex){
  const kind = modeKind();
  const lvl = getLevels()[levelIndex];
  const t0 = nowMs();
  const base = {
    levelIndex,
    startTime: t0,
    completedAt: 0,
    pausedAt: 0,
    liveStrokes: [],
    rightStrokes: [],
    echoQueue: [],
    travelParticles: [],
    strokesUsed: 0,
    isDrawing: false,
    currentStrokeIndex: -1,
    finished: false,
    result: null,
    inkUsed: 0,
    inkLimit: lvl.inkBudget||0,
    lastInkPoint: null,
    inkOut: false
  };

  if(kind==='memory'){
    base.memory = {
      phase: 'memorize',          // 'memorize' -> 'ready' -> 'draw'
      phaseUntil: t0 + lvl.memorizeMs,
      drawStartTime: 0
    };
  }
  if(kind==='dots'){
    const firstDotMs = dotDurationFor(lvl, 0);
    base.dots = {
      idx: 0,
      hits: 0,
      total: lvl.dotsPoints.length,
      hitPoints: [],
      missed: [],
      curDotMs: firstDotMs,
      dotUntil: t0 + firstDotMs,
      reactionRatios: [],
      lastDotStart: t0
    };
  }
  if(kind==='duo'){
    base.duo = {
      leftStrokes: [], rightStrokes: [],
      leftPointerId: null, rightPointerId: null,   /* پیگیریِ لمسِ خام (چه در حالِ کشیدن باشد چه منتظرِ طرفِ مقابل) */
      leftPos: null, rightPos: null,                /* آخرین مختصاتِ همان لمسِ خام، حتی وقتی هنوز اجازهٔ کشیدن ندارد */
      leftDrawing:false, rightDrawing:false,        /* true فقط وقتی هر دو طرف هم‌زمان لمس شده باشند */
      leftStrokeIdx:-1, rightStrokeIdx:-1,
      leftStrokesUsed:0, rightStrokesUsed:0,
      leftStartTime:0, rightStartTime:0,
      leftInkUsed:0, rightInkUsed:0,
      leftInkLimit: lvl.leftInkBudget||0, rightInkLimit: lvl.rightInkBudget||0,
      leftLastInkPoint:null, rightLastInkPoint:null,
      leftInkOut:false, rightInkOut:false
    };
  }
  if(kind==='trail'){
    base.trail = {
      started: false,
      segIndex: 0,
      segElapsed: 0,
      inGap: false,
      gapElapsed: 0,
      pointerDown: false,
      pointerPos: null,
      accSum: 0,
      accFrames: 0,
      downFrames: 0,
      totalFrames: 0,
      badStreakMs: 0,
      worstBadStreakMs: 0,
      livePath: [],
      liveAccuracy: 0
    };
  }
  if(kind==='chain'){
    base.chain = {
      curIdx: 0,           /* اندیسِ خطی که الان باید کشیده شود؛ خط‌های بعد از این هنوز نمایان نیستند */
      rejectUntil: 0,       /* اگر آخرین تلاش رد شده باشد، تا این زمان پیامِ «دوباره امتحان کن» روی صفحه می‌ماند */
      lastAcc: 0
    };
  }
  if(kind==='fill'){
    const fillMask = getFillMask(lvl);
    base.fill = {
      paintGrid: new Uint8Array(fillMask.res*fillMask.res),
      paintedInsideCount: 0,
      paintedOutsideCount: 0,
      lastPaintPoint: null,
      lastMilestone: 0,   /* آخرین پلهٔ ۲۵٪ که جشن گرفته شده (۰،۲۵،۵۰،۷۵،۱۰۰) */
      comboWindow: []      /* آخرین چند خالِ رنگ: هرکدام true (تمیز) یا false (بیرون‌زده) -- برای نمایشِ زنجیرهٔ تمیزکاری */
    };
  }
  return base;
}

/* =====================================================================
   بخش ۷: مدیریت ورودی لمسی/ماوس (Input Handling)
   بازیکن فقط در بخش چپ (آبی) نقاشی می‌کشد. هر نقطهٔ ثبت‌شده هم بلافاصله
   در بخش چپ رسم می‌شود و هم با ۲ ثانیه تأخیر وارد صف پژواک می‌شود تا در
   بخش راست ظاهر شود. ورودی‌ها با فاصلهٔ زمانی/مکانیِ حداقلی نمونه‌برداری
   می‌شوند تا هم کارایی حفظ شود و هم دادهٔ مسیر تمیز بماند.
   ===================================================================== */
const MIN_POINT_DIST  = 0.010;
const MIN_POINT_TIME  = 20;

function getZoneRects(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const hudTop = 66, hudBottom = 88, gap = 22, pad = 20;
  const top = hudTop, bh = Math.max(80, h - hudTop - hudBottom);
  const halfW = (w - gap)/2;
  return {
    left:  {x:0,          y:top, width:halfW, height:bh, pad},
    right: {x:halfW+gap,  y:top, width:halfW, height:bh, pad},
    gap, hudTop, hudBottom
  };
}
/* یک قابِ کامل و تک‌بخشی برای بازی‌هایی که دیگر دو نیمهٔ چپ/راست ندارند
   (ردِ حافظه، شکار نقطه‌ها، ردِ نور) */
function getPlayZone(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const hudTop = 66, hudBottom = 88, pad = 26;
  const top = hudTop, bh = Math.max(80, h - hudTop - hudBottom);
  const maxW = Math.min(w, 560);
  return { x:(w-maxW)/2, y:top, width:maxW, height:bh, pad };
}

function toNormalized(px, py, zone){
  const iw = zone.width - zone.pad*2, ih = zone.height - zone.pad*2;
  return { x: clamp((px - zone.x - zone.pad)/iw, 0, 1), y: clamp((py - zone.y - zone.pad)/ih, 0, 1) };
}
function fromNormalized(nx, ny, zone, mirrored){
  const iw = zone.width - zone.pad*2, ih = zone.height - zone.pad*2;
  const px = mirrored ? (1-nx) : nx;
  return { x: zone.x+zone.pad+px*iw, y: zone.y+zone.pad+ny*ih };
}
function pointInRect(px,py,r){ return px>=r.x && px<=r.x+r.width && py>=r.y && py<=r.y+r.height; }

function handlePointerDown(px, py, pointerId){
  if(currentScreen!==SCREEN.PLAYING || activeModal || !attempt || attempt.finished) return;
  const kind = modeKind();
  if(kind==='echo') handleEchoPointerDown(px,py);
  else if(kind==='memory') handleMemoryPointerDown(px,py);
  else if(kind==='dots') handleDotsPointerDown(px,py);
  else if(kind==='trail') handleTrailPointerDown(px,py);
  else if(kind==='duo') handleDuoPointerDown(px,py,pointerId);
  else if(kind==='chain') handleChainPointerDown(px,py);
  else if(kind==='fill') handleFillPointerDown(px,py);
  else if(kind==='wind') handleWindPointerDown(px,py);
  else if(kind==='nolift') handleNoLiftPointerDown(px,py);
  else if(kind==='noretrace') handleNoRetracePointerDown(px,py);
}
function handlePointerMove(px, py, pointerId){
  if(!attempt) return;
  const kind = modeKind();
  if(kind==='echo') handleEchoPointerMove(px,py);
  else if(kind==='memory') handleMemoryPointerMove(px,py);
  else if(kind==='trail') handleTrailPointerMove(px,py);
  else if(kind==='duo') handleDuoPointerMove(px,py,pointerId);
  else if(kind==='chain') handleChainPointerMove(px,py);
  else if(kind==='fill') handleFillPointerMove(px,py);
  else if(kind==='wind') handleWindPointerMove(px,py);
  else if(kind==='nolift') handleNoLiftPointerMove(px,py);
  else if(kind==='noretrace') handleNoRetracePointerMove(px,py);
}
function handlePointerUp(pointerId){
  if(!attempt) return;
  const kind = modeKind();
  if(kind==='echo') handleEchoPointerUp();
  else if(kind==='memory') handleMemoryPointerUp();
  else if(kind==='trail') handleTrailPointerUp();
  else if(kind==='duo') handleDuoPointerUp(pointerId);
  else if(kind==='chain') handleChainPointerUp();
  else if(kind==='fill') handleFillPointerUp();
  else if(kind==='wind') handleWindPointerUp();
  else if(kind==='nolift') handleNoLiftPointerUp();
  else if(kind==='noretrace') handleNoRetracePointerUp();
}

/* ----- کلاسیک: پژواک چرخشی (رفتار اصلیِ بدون تغییرِ بازی) ----- */
function handleEchoPointerDown(px, py){
  const zones = getZoneRects();
  if(!pointInRect(px,py,zones.left)) return;
  attempt.isDrawing = true;
  attempt.currentStrokeIndex++;
  attempt.liveStrokes[attempt.currentStrokeIndex] = { points: [], done:false };
  attempt.lastPointTime = 0;
  attempt.lastInkPoint = null; /* شروعِ ضربهٔ جدید نباید هزینهٔ «پرش» نامرئیِ قلم از پایانِ ضربهٔ قبلی را از سقفِ جوهر کم کند؛ فقط خطِ واقعاً کشیده‌شده باید هزینه داشته باشد */
  SFX.strokeStart();
  addPoint(px,py,zones);
}
function handleEchoPointerMove(px, py){
  if(!attempt.isDrawing) return;
  const zones = getZoneRects();
  addPoint(px,py,zones);
}
function handleEchoPointerUp(){
  if(!attempt.isDrawing) return;
  attempt.isDrawing = false;
  attempt.strokesUsed++;
  const s = attempt.liveStrokes[attempt.currentStrokeIndex];
  if(s) s.done = true;
}

/* ----- ردِ حافظه: فقط در فاز «کشیدن» می‌توان قلم روی صفحه گذاشت ----- */
function handleMemoryPointerDown(px, py){
  if(attempt.memory.phase!=='draw') return;
  const zone = getPlayZone();
  if(!pointInRect(px,py,zone)) return;
  attempt.isDrawing = true;
  attempt.currentStrokeIndex++;
  attempt.liveStrokes[attempt.currentStrokeIndex] = { points: [], done:false };
  attempt.lastPointTime = 0;
  attempt.lastInkPoint = null; /* شروعِ ضربهٔ جدید نباید هزینهٔ «پرش» نامرئیِ قلم از پایانِ ضربهٔ قبلی را از سقفِ جوهر کم کند؛ فقط خطِ واقعاً کشیده‌شده باید هزینه داشته باشد */
  SFX.strokeStart();
  addPointMemory(px,py,zone);
}
function handleMemoryPointerMove(px, py){
  if(!attempt.isDrawing) return;
  addPointMemory(px,py,getPlayZone());
}
function handleMemoryPointerUp(){
  if(!attempt.isDrawing) return;
  attempt.isDrawing = false;
  attempt.strokesUsed++;
  const s = attempt.liveStrokes[attempt.currentStrokeIndex];
  if(s) s.done = true;
}

/* ----- شکار نقطه‌ها: هر لمس، فقط تلاشی برای زدنِ نقطهٔ فعلی است ----- */
function handleDotsPointerDown(px, py){
  const d = attempt.dots, lvl = currentLevel();
  if(d.idx>=d.total) return;
  const zone = getPlayZone();
  const target = fromNormalized(lvl.dotsPoints[d.idx].x, lvl.dotsPoints[d.idx].y, zone, false);
  const rTouch = Math.max(30, Math.min(zone.width,zone.height)*lvl.dotToleranceR*1.6);
  if(dist(px,py,target.x,target.y) <= rTouch) registerDotHit();
}

/* ----- ردِ نور: انگشت باید پیوسته نزدیکِ نقطهٔ نورانی بماند ----- */
function handleTrailPointerDown(px, py){
  attempt.trail.pointerDown = true;
  attempt.trail.pointerPos = {x:px,y:py};
  attempt.trail.started = true;
}
function handleTrailPointerMove(px, py){
  if(!attempt.trail.pointerDown) return;
  attempt.trail.pointerPos = {x:px,y:py};
}
function handleTrailPointerUp(){
  attempt.trail.pointerDown = false;
}

/* ----- دو دستی: هیچ‌کدام از دو طرف تا وقتی طرفِ مقابل هم لمس نشده
   اجازهٔ کشیدن ندارد -----
   قبلاً هر طرف کاملاً مستقل بود، یعنی می‌شد اول چپ را کامل کشید و
   انگشت را برداشت، بعد رفت سراغِ راست -- و همین باعث می‌شد بشود با
   یک دست، پشتِ سرِ هم، هر دو طرف را کشید و برد. حالا هر لمس تا وقتی
   طرفِ مقابل هم لمس نشده فقط «در انتظار» می‌ماند (نه رسم می‌کند، نه
   ضربه‌ای برایش حساب می‌شود) و به‌محضِ اینکه هر دو طرف هم‌زمان لمس
   شدند، هر دو ضربه از همان لحظه شروع می‌شوند. لازم نیست دقیقاً در یک
   میلی‌ثانیه باشد؛ همین‌که همپوشانی داشته باشند کافی است. */
function handleDuoPointerDown(px, py, pointerId){
  const zones = getZoneRects();
  const d = attempt.duo;
  if(d.leftPointerId===null && pointInRect(px,py,zones.left)){
    d.leftPointerId = pointerId;
    d.leftPos = {x:px,y:py};
  } else if(d.rightPointerId===null && pointInRect(px,py,zones.right)){
    d.rightPointerId = pointerId;
    d.rightPos = {x:px,y:py};
  } else {
    return;
  }
  tryStartDuoDrawing();
}
/* وقتی هر دو طرف هم‌زمان لمس شده باشند، برای هر طرفی که هنوز شروع
   نکرده، یک ضربهٔ تازه از همان نقطه‌ای که الان انگشتش آنجاست باز
   می‌شود. */
function tryStartDuoDrawing(){
  const d = attempt.duo;
  if(d.leftPointerId===null || d.rightPointerId===null) return;
  const zones = getZoneRects();
  let started = false;
  if(!d.leftDrawing && d.leftPos){
    d.leftDrawing = true;
    d.leftStrokeIdx++;
    d.leftStrokes[d.leftStrokeIdx] = { points: [] };
    d.leftLastInkPoint = null; /* پرشِ بینِ دو ضربه هزینه ندارد -- ولی اگر جوهرِ همین دست ته کشیده باشد، addPointDuo باز هم جلوی نقطهٔ اول را می‌گیرد */
    if(!d.leftStartTime) d.leftStartTime = nowMs();
    addPointDuo(d.leftPos.x, d.leftPos.y, zones.left, 'left');
    started = true;
  }
  if(!d.rightDrawing && d.rightPos){
    d.rightDrawing = true;
    d.rightStrokeIdx++;
    d.rightStrokes[d.rightStrokeIdx] = { points: [] };
    d.rightLastInkPoint = null;
    if(!d.rightStartTime) d.rightStartTime = nowMs();
    addPointDuo(d.rightPos.x, d.rightPos.y, zones.right, 'right');
    started = true;
  }
  if(started) SFX.strokeStart();
}
function handleDuoPointerMove(px, py, pointerId){
  const d = attempt.duo;
  if(!d) return;
  const zones = getZoneRects();
  if(pointerId===d.leftPointerId){
    d.leftPos = {x:px,y:py};
    if(d.leftDrawing) addPointDuo(px, py, zones.left, 'left');
  } else if(pointerId===d.rightPointerId){
    d.rightPos = {x:px,y:py};
    if(d.rightDrawing) addPointDuo(px, py, zones.right, 'right');
  }
}
function handleDuoPointerUp(pointerId){
  const d = attempt.duo;
  if(!d) return;
  if(pointerId===d.leftPointerId){
    if(d.leftDrawing){ d.leftDrawing=false; d.leftStrokesUsed++; }
    d.leftPointerId=null; d.leftPos=null;
  } else if(pointerId===d.rightPointerId){
    if(d.rightDrawing){ d.rightDrawing=false; d.rightStrokesUsed++; }
    d.rightPointerId=null; d.rightPos=null;
  }
}
function addPointDuo(px, py, zone, side){
  const d = attempt.duo;
  const n = toNormalized(px, py, zone);
  const strokes = side==='left' ? d.leftStrokes : d.rightStrokes;
  const idx = side==='left' ? d.leftStrokeIdx : d.rightStrokeIdx;
  const stroke = strokes[idx];
  const last = stroke.points[stroke.points.length-1];
  if(last && dist(last.x,last.y,n.x,n.y) < MIN_POINT_DIST) return;

  /* جوهرِ هر دست مستقل است؛ درست مثلِ سایرِ حالت‌ها، حتی اولین نقطهٔ
     یک ضربهٔ کاملاً تازه هم اگر جوهرِ همان دست از قبل تمام شده باشد
     رد می‌شود -- تا نتوان با بلندکردنِ انگشت و تک‌تک‌زدن دور زد. */
  const usedKey = side==='left' ? 'leftInkUsed' : 'rightInkUsed';
  const limitKey = side==='left' ? 'leftInkLimit' : 'rightInkLimit';
  const lastInkKey = side==='left' ? 'leftLastInkPoint' : 'rightLastInkPoint';
  const outKey = side==='left' ? 'leftInkOut' : 'rightInkOut';
  if(d[usedKey] >= d[limitKey]){
    if(!d[outKey]){ d[outKey] = true; SFX.inkOut(); showInkOutToast(); }
    return;
  }
  if(d[lastInkKey]){
    const segDist = dist(d[lastInkKey].x, d[lastInkKey].y, n.x, n.y);
    if(d[usedKey] + segDist > d[limitKey]){
      if(!d[outKey]){ d[outKey] = true; SFX.inkOut(); showInkOutToast(); }
      d[usedKey] = d[limitKey];
      return;
    }
    d[usedKey] += segDist;
  }
  d[lastInkKey] = n;
  stroke.points.push({x:n.x, y:n.y});
}
function finishDuoLevel(leftAcc, rightAcc, overall){
  const lvl = currentLevel(), d = attempt.duo;
  const startedAt = Math.min(d.leftStartTime||attempt.startTime, d.rightStartTime||attempt.startTime);
  const elapsed = nowMs()-startedAt;
  const speedStar = elapsed <= lvl.parTimeMs ? 1:0;
  const accuracyStar = overall >= STAR_ACCURACY_THRESHOLD ? 1:0;
  const efficiencyStar = (d.leftStrokesUsed<=lvl.leftStrokesRequired && d.rightStrokesUsed<=lvl.rightStrokesRequired) ? 1:0;
  finalizeLevel(speedStar+accuracyStar+efficiencyStar, overall);
}

/* ----- خط به خط: کلِ شکل هیچ‌وقت یک‌جا روی صفحه نیست -----
   فقط نقطه‌چینِ خطِ فعلی (attempt.chain.curIdx) نشان داده می‌شود. هر
   ضربه، به‌محضِ بلندشدنِ انگشت، جدا و فوری در برابرِ همان یک خطِ هدف
   سنجیده می‌شود: قبول شد → همان‌جا می‌ماند و نوبت به خطِ بعدی می‌رسد؛
   رد شد → پاک می‌شود و همان خط باید دوباره امتحان شود. جوهر برای کلِ
   تلاش مشترک است، پس امتحانِ زیادی روی یک خط، برای خط‌های بعدی جوهر
   کم می‌گذارد. */
function handleChainPointerDown(px, py){
  const lvl = currentLevel(), c = attempt.chain;
  if(c.curIdx>=lvl.strokesRequired) return;
  const zone = getPlayZone();
  if(!pointInRect(px,py,zone)) return;
  attempt.isDrawing = true;
  attempt.currentStrokeIndex++;
  attempt.liveStrokes[attempt.currentStrokeIndex] = { points: [], done:false };
  attempt.lastPointTime = 0;
  attempt.lastInkPoint = null;
  SFX.strokeStart();
  addPointChain(px,py,zone);
}
function handleChainPointerMove(px, py){
  if(!attempt.isDrawing) return;
  addPointChain(px,py,getPlayZone());
}
function handleChainPointerUp(){
  if(!attempt.isDrawing) return;
  attempt.isDrawing = false;
  attempt.strokesUsed++; /* هر تلاش، موفق یا ناموفق، حساب می‌شود -- تکرارِ زیاد یعنی از‌دست‌رفتنِ ستاره‌ی کارایی */
  const idx = attempt.currentStrokeIndex;
  const s = attempt.liveStrokes[idx];
  if(s) s.done = true;
  const lvl = currentLevel(), c = attempt.chain;
  const targetStroke = lvl.shape[c.curIdx];
  const acc = s ? scoreSide([targetStroke], [s], lvl.tolerance) : 0;
  c.lastAcc = acc;
  if(acc >= MIN_PASS_ACCURACY){
    c.curIdx++;
    c.rejectUntil = 0;
    SFX.echoLand();
  } else {
    attempt.liveStrokes[idx] = null; /* تلاشِ ناموفق از صفحه پاک می‌شود تا با تلاشِ بعدی قاطی نشود */
    c.rejectUntil = nowMs()+950;
    SFX.inkOut();
  }
}
function addPointChain(px, py, zone){
  const t = nowMs();
  if(t - attempt.lastPointTime < MIN_POINT_TIME) return;
  const n = toNormalized(px, py, zone);
  const stroke = attempt.liveStrokes[attempt.currentStrokeIndex];
  const last = stroke.points[stroke.points.length-1];
  if(last && dist(last.x,last.y,n.x,n.y) < MIN_POINT_DIST) return;
  /* اگر جوهر از قبل ته کشیده باشد، حتی اولین نقطهٔ یک ضربهٔ کاملاً
     تازه هم دیگر مجاز نیست -- وگرنه با بلندکردنِ قلم و تک‌تک‌زدن
     می‌شد از سقفِ جوهر دور زد (باگی که پیدا و اصلاح شد). */
  if(attempt.inkUsed >= attempt.inkLimit){
    if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
    return;
  }
  if(attempt.lastInkPoint){
    const segDist = dist(attempt.lastInkPoint.x, attempt.lastInkPoint.y, n.x, n.y);
    if(attempt.inkUsed + segDist > attempt.inkLimit){
      if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
      attempt.inkUsed = attempt.inkLimit;
      return;
    }
    attempt.inkUsed += segDist;
  }
  attempt.lastInkPoint = n;
  stroke.points.push({x:n.x, y:n.y});
  attempt.lastPointTime = t;
}
function completeChainLevel(overallAccuracy){
  const lvl = currentLevel();
  const elapsed = nowMs() - attempt.startTime;
  const stars = computeStars(elapsed, lvl, overallAccuracy, attempt.strokesUsed);
  finalizeLevel(stars, overallAccuracy);
}

/* ----- رنگ‌آمیزیِ سایه: انگشت دیگر خط نمی‌کشد، رنگ می‌پاشد -----
   هر لمس یا کشش، یک لکهٔ گردِ رنگ (به‌شعاعِ lvl.brushR، که در مراحلِ
   جلوتر ریزتر می‌شود) روی شبکهٔ
   رنگ‌پذیریِ مرحله می‌نشاند. برخلافِ بقیهٔ مدل‌ها، اینجا نه تولرانسی
   در کار است و نه تطبیقِ نقطه‌به‌نقطه با یک مسیرِ هدف؛ فقط این‌که
   خانه‌های داخلِ سایه چقدر پوشیده شده‌اند و چقدر رنگ از خط بیرون زده. */
function handleFillPointerDown(px, py){
  const zone = getPlayZone();
  if(!pointInRect(px,py,zone)) return;
  attempt.isDrawing = true;
  attempt.currentStrokeIndex++;
  attempt.liveStrokes[attempt.currentStrokeIndex] = { points: [], done:false };
  attempt.fill.lastPaintPoint = null;
  SFX.strokeStart();
  addPointFill(px,py,zone);
}
function handleFillPointerMove(px, py){
  if(!attempt.isDrawing) return;
  addPointFill(px,py,getPlayZone());
}
function handleFillPointerUp(){
  if(!attempt.isDrawing) return;
  attempt.isDrawing = false;
  attempt.strokesUsed++;
  const s = attempt.liveStrokes[attempt.currentStrokeIndex];
  if(s) s.done = true;
  attempt.fill.lastPaintPoint = null;
}
function spawnFillMilestoneSpark(zone, big){
  const cx = zone.x+zone.width/2, cy = zone.y+zone.height/2;
  const count = big ? 46 : 18;
  const colors = ['#7bd8ff','#ffd27a','#7bffb0'];
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, sp = (big?1.8:1.0)+Math.random()*(big?3.6:2.0);
    sparkBursts.push({
      x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(big?1.4:0.5),
      life:0, maxLife:(big?700:380)+Math.random()*300,
      color: colors[i%colors.length], size:1.8+Math.random()*(big?3:2)
    });
  }
}
function addPointFill(px, py, zone){
  const n = toNormalized(px, py, zone);
  const stroke = attempt.liveStrokes[attempt.currentStrokeIndex];
  const last = stroke.points[stroke.points.length-1];
  if(!last || dist(last.x,last.y,n.x,n.y) >= 0.007) stroke.points.push({x:n.x, y:n.y});

  const lvl = currentLevel();
  const fillMask = getFillMask(lvl);
  const f = attempt.fill;
  const brushR = lvl.brushR || FILL_BRUSH_R_DEFAULT;
  const prev = f.lastPaintPoint;
  const steps = prev ? Math.max(1, Math.ceil(dist(prev.x,prev.y,n.x,n.y)/0.018)) : 1;
  const beforeOutside = f.paintedOutsideCount;
  for(let s=1; s<=steps; s++){
    const sx = prev ? lerp(prev.x, n.x, s/steps) : n.x;
    const sy = prev ? lerp(prev.y, n.y, s/steps) : n.y;
    stampFillBrush(sx, sy, fillMask, f, brushR);
  }
  f.lastPaintPoint = n;
  attempt.lastPointTime = nowMs();

  /* زنجیرهٔ تمیزکاری: اگر این خالِ رنگ چیزی به بیرون‌زدگی اضافه نکرد
     «تمیز» حساب می‌شود -- برای هشدارِ لحظه‌ایِ روی HUD (رجوع کنید به
     renderFill) نگه‌داری می‌شود، نه فقط یک درصدِ نهاییِ خشک. */
  f.comboWindow.push(f.paintedOutsideCount===beforeOutside);
  if(f.comboWindow.length>24) f.comboWindow.shift();

  /* جشنِ کوچکِ ذره‌ای هر بار پوششِ داخلِ سایه از یک پلهٔ ۲۵٪ رد شود --
     حسِ پیشرفتِ محسوس و لحظه‌ای، به‌جای فقط یک عددِ در حالِ تغییر. */
  const coverage = f.paintedInsideCount/fillMask.insideCount;
  const step = Math.min(100, Math.floor(coverage*4)*25);
  if(step > f.lastMilestone && step>0){
    f.lastMilestone = step;
    spawnFillMilestoneSpark(zone, step>=100);
    SFX.echoLand();
  }
}
function finishFillLevel(){
  const lvl = currentLevel(), f = attempt.fill, fillMask = getFillMask(lvl);
  const coverage = clamp(f.paintedInsideCount/fillMask.insideCount, 0, 1);
  const overflowFrac = f.paintedOutsideCount/fillMask.insideCount;
  const accuracy = clamp((coverage - overflowFrac*0.55)*100, 0, 100);
  const elapsed = nowMs() - attempt.startTime;
  const speedStar = elapsed <= lvl.parTimeMs ? 1:0;
  const coverageStar = coverage >= (lvl.coverageTarget||0.75) ? 1:0;
  const cleanThreshold = lvl.maxCleanOverflow!=null ? lvl.maxCleanOverflow : 0.22;
  const cleanStar = overflowFrac <= cleanThreshold ? 1:0;
  finalizeLevel(speedStar+coverageStar+cleanStar, accuracy);
}

/* نقطه‌ای که در چپ کشیده می‌شود را طبق مکانیکِ مرحلهٔ جاری (چرخش، و از
   مرحلهٔ ۲۰ به بعد چرخش+آینه) به مختصاتِ متناظرش در بخشِ راست می‌برد. */
function echoPoint(p, level){
  let q = rotatePoint(p, level.rotation);
  if(level.crossed) q = {x:1-q.x, y:q.y};
  return q;
}

function addPoint(px, py, zones){
  const t = nowMs();
  if(t - attempt.lastPointTime < MIN_POINT_TIME) return;
  const n = toNormalized(px, py, zones.left);
  const stroke = attempt.liveStrokes[attempt.currentStrokeIndex];
  const last = stroke.points[stroke.points.length-1];
  if(last && dist(last.x,last.y,n.x,n.y) < MIN_POINT_DIST) return;

  /* هزینهٔ جوهر: فاصله از آخرین نقطه‌ای که در کلِ این تلاش رسم شده،
     نه فقط آخرین نقطهٔ همین ضربه — تا شروعِ ضربه‌های جدید در نقاطِ
     دیگرِ صفحه هم از سقفِ جوهر کم کند و نتوان با نقطه‌های پراکندهٔ
     مجزا دور زد. */
  /* اگر جوهر از قبل ته کشیده باشد، حتی اولین نقطهٔ یک ضربهٔ کاملاً
     تازه هم دیگر مجاز نیست -- وگرنه با بلندکردنِ قلم و تک‌تک‌زدن
     می‌شد از سقفِ جوهر دور زد (باگی که پیدا و اصلاح شد). */
  if(attempt.inkUsed >= attempt.inkLimit){
    if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
    return;
  }
  if(attempt.lastInkPoint){
    const segDist = dist(attempt.lastInkPoint.x, attempt.lastInkPoint.y, n.x, n.y);
    if(attempt.inkUsed + segDist > attempt.inkLimit){
      if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
      attempt.inkUsed = attempt.inkLimit;
      return;
    }
    attempt.inkUsed += segDist;
  }
  attempt.lastInkPoint = n;

  stroke.points.push({x:n.x, y:n.y});
  attempt.lastPointTime = t;
  const delayMs = currentLevel().echoDelayMs;
  const echoed = echoPoint(n, currentLevel());
  attempt.echoQueue.push({ strokeIndex: attempt.currentStrokeIndex, point:{x:n.x,y:n.y}, echoed, replayAt:t+delayMs });
  const fromPx = fromNormalized(n.x, n.y, zones.left, false);
  const toPx   = fromNormalized(echoed.x, echoed.y, zones.right, false);
  attempt.travelParticles.push({ from:fromPx, to:toPx, startTime:t, duration:delayMs });
}

/* نسخهٔ «ردِ حافظه»: همان محدودیتِ جوهر، بدون هیچ صفِ پژواکی */
function addPointMemory(px, py, zone){
  const t = nowMs();
  if(t - attempt.lastPointTime < MIN_POINT_TIME) return;
  const n = toNormalized(px, py, zone);
  const stroke = attempt.liveStrokes[attempt.currentStrokeIndex];
  const last = stroke.points[stroke.points.length-1];
  if(last && dist(last.x,last.y,n.x,n.y) < MIN_POINT_DIST) return;
  if(attempt.inkUsed >= attempt.inkLimit){
    if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
    return;
  }
  if(attempt.lastInkPoint){
    const segDist = dist(attempt.lastInkPoint.x, attempt.lastInkPoint.y, n.x, n.y);
    if(attempt.inkUsed + segDist > attempt.inkLimit){
      if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
      attempt.inkUsed = attempt.inkLimit;
      return;
    }
    attempt.inkUsed += segDist;
  }
  attempt.lastInkPoint = n;
  stroke.points.push({x:n.x, y:n.y});
  attempt.lastPointTime = t;
}

/* ----- بومِ بادی: کشیدنِ آزادِ چندضربه‌ای، درست مثلِ «ردِ حافظه»،
   منتها راهنما همیشه دیده می‌شود -- فقط ثابت نمی‌ایستد ----- */
function handleWindPointerDown(px, py){

}

}
function handleWindPointerUp(){

  if(s) s.done = true;
}
function addPointWind(px, py, zone){
  const t = nowMs();
  if(t - attempt.lastPointTime < MIN_POINT_TIME) return;

  const stroke = attempt.liveStrokes[attempt.currentStrokeIndex];
  const last = stroke.points[stroke.points.length-1];

  if(attempt.inkUsed >= attempt.inkLimit){
    if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
    return;
  }
  if(attempt.lastInkPoint){
    const segDist = dist(attempt.lastInkPoint.x, attempt.lastInkPoint.y, n.x, n.y);
    if(attempt.inkUsed + segDist > attempt.inkLimit){
      if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
      attempt.inkUsed = attempt.inkLimit;
      return;

    attempt.inkUsed += segDist;
  }
  attempt.lastInkPoint = n;
  stroke.points.push({x:n.x, y:n.y});
