/* ----- بی‌وقفه / بی‌بازگشت: یک ضربهٔ پیوسته، تا آخرِ شکل -----
   هر دو مدل دقیقاً یک ضربهٔ فیزیکی می‌خواهند. اگر انگشت زودتر از
   موعد بلند شود (یعنی هنوز به دقتِ لازم نرسیده)، یا در «بی‌بازگشت»
   مسیر از روی خطِ قبلیِ خودش رد شود، کل تلاش باطل می‌شود و مرحله از
   نقطهٔ شروع، از نو ساخته می‌شود -- makeAttempt همان کاری‌ست که
   دکمهٔ «بازنشانی» هم انجام می‌دهد، پس هیچ حالتِ نیمه‌کاره‌ای باقی
   نمی‌ماند. */
const RETRACE_IGNORE_RECENT = 14;
/* نقطهٔ شروعِ هر ضربه را هم از چکِ «روی خط قبلی نیفتادن» کنار می‌گذاریم؛
   وگرنه وقتی بازیکن برای تکمیل و بستنِ شکل (مثلاً بستنِ یک مثلث) به همان
   نقطهٔ شروع برمی‌گردد -- که خودِ قانونِ شکل ایجاب می‌کند -- به‌اشتباه
   به‌عنوانِ «بازگشت روی خط قبلی» شمرده می‌شد و کل تلاش باطل می‌شد. */
const RETRACE_IGNORE_START = 14;
function handleNoLiftPointerDown(px, py){
  if(attempt.isDrawing) return;
  const zone = getPlayZone();
  if(!pointInRect(px,py,zone)) return;
  attempt.isDrawing = true;
  attempt.currentStrokeIndex++;
  attempt.liveStrokes[attempt.currentStrokeIndex] = { points: [], done:false };
  attempt.lastPointTime = 0;
  attempt.lastInkPoint = null;
  SFX.strokeStart();
  addPointMemory(px,py,zone);
}
function handleNoLiftPointerMove(px, py){
  if(!attempt.isDrawing) return;
  addPointMemory(px, py, getPlayZone());
}
function handleNoLiftPointerUp(){
  if(!attempt.isDrawing) return;
  attempt.isDrawing = false;
  attempt.strokesUsed++;
  const s = attempt.liveStrokes[attempt.currentStrokeIndex];
  if(s) s.done = true;
  finishNoLiftAttempt();
}
function handleNoRetracePointerDown(px, py){
  if(attempt.isDrawing) return;
  const zone = getPlayZone();
  if(!pointInRect(px,py,zone)) return;
  attempt.isDrawing = true;
  attempt.currentStrokeIndex++;
  attempt.liveStrokes[attempt.currentStrokeIndex] = { points: [], done:false };
  attempt.lastPointTime = 0;
  attempt.lastInkPoint = null;
  SFX.strokeStart();
  addPointNoRetrace(px,py,zone);
}
function handleNoRetracePointerMove(px, py){
  if(!attempt.isDrawing) return;
  addPointNoRetrace(px, py, getPlayZone());
}
function handleNoRetracePointerUp(){
  if(!attempt.isDrawing) return;
  attempt.isDrawing = false;
  attempt.strokesUsed++;
  const s = attempt.liveStrokes[attempt.currentStrokeIndex];
  if(s) s.done = true;
  finishNoLiftAttempt();
}
function addPointNoRetrace(px, py, zone){
  const t = nowMs();
  if(t - attempt.lastPointTime < MIN_POINT_TIME) return;
  const n = toNormalized(px, py, zone);
  const stroke = attempt.liveStrokes[attempt.currentStrokeIndex];
  const last = stroke.points[stroke.points.length-1];
  if(last && dist(last.x,last.y,n.x,n.y) < MIN_POINT_DIST) return;
  const retraceTol = currentLevel().retraceTolerance||0.035;
  const lookback = Math.max(RETRACE_IGNORE_START, stroke.points.length - RETRACE_IGNORE_RECENT);
  for(let i=RETRACE_IGNORE_START;i<lookback;i++){
    const p = stroke.points[i];
    if(dist(p.x,p.y,n.x,n.y) < retraceTol){ restartNoLiftAttempt(); return; }
  }
  if(attempt.inkUsed >= attempt.inkLimit){
    if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
    return;
  }
  if(attempt.lastInkPoint){
    const segDist = dist(attempt.lastInkPoint.x, attempt.lastInkPoint.y, n.x, n.y);
    if(attempt.inkUsed + segDist > attempt.inkLimit){
      if(!attempt.inkOut){ attempt.inkOut = true; SFX.inkOut(); showInkOutToast(); }
      attempt.inkUsed = attempt.inkLimit;
      return;
    }
    attempt.inkUsed += segDist;
  }
  attempt.lastInkPoint = n;
  stroke.points.push({x:n.x, y:n.y});
  attempt.lastPointTime = t;
}
function finishNoLiftAttempt(){
  const lvl = currentLevel();
  const acc = scoreSide(lvl.shape, attempt.liveStrokes, lvl.tolerance);
  if(acc >= MIN_PASS_ACCURACY){
    const elapsed = nowMs() - attempt.startTime;
    const stars = computeStars(elapsed, lvl, acc, attempt.strokesUsed);
    finalizeLevel(stars, acc);
  } else {
    restartNoLiftAttempt();
  }
}
function restartNoLiftAttempt(){
  SFX.restart();
  showRestartToast();
  attempt = makeAttempt(currentLevelIndex);
}
function completeWindLevel(accuracy){
  const lvl = currentLevel();
  const elapsed = nowMs() - attempt.startTime;
  const stars = computeStars(elapsed, lvl, accuracy, attempt.strokesUsed);
  finalizeLevel(stars, accuracy);
}

/* =====================================================================
   بخش ۸: پردازش صف پژواک (Echo Queue Processing)
   صف بر اساس زمان ثبت، طبیعتاً مرتب است (چون نقاط به‌ترتیب زمان اضافه
   می‌شوند)، پس می‌توان آن را مثل یک صف واقعی (FIFO) از جلو خالی کرد.
   ===================================================================== */
function processEchoQueue(now_){
  if(!attempt) return;
  while(attempt.echoQueue.length && attempt.echoQueue[0].replayAt <= now_){
    const ev = attempt.echoQueue.shift();
    if(!attempt.rightStrokes[ev.strokeIndex]) attempt.rightStrokes[ev.strokeIndex] = { points: [] };
    const arr = attempt.rightStrokes[ev.strokeIndex].points;
    if(arr.length===0) SFX.echoLand();
    arr.push({x:ev.echoed.x, y:ev.echoed.y});
    spawnLandingSpark(ev.strokeIndex);
  }
}

/* ----- به‌روزرسانیِ فازِ «ردِ حافظه» (نمایش → آماده → کشیدن) ----- */
function updateMemoryPhase(now_){
  const m = attempt.memory;
  if(m.phase==='memorize' && now_ >= m.phaseUntil){
    m.phase = 'ready';
    m.phaseUntil = now_ + 450;
  } else if(m.phase==='ready' && now_ >= m.phaseUntil){
    m.phase = 'draw';
    m.drawStartTime = now_;
  }
}

/* ----- به‌روزرسانیِ زمان‌سنجِ هر نقطه در «شکار نقطه‌ها» ----- */
function updateDotsTimer(now_){
  const d = attempt.dots, lvl = currentLevel();
  if(!d || d.idx>=d.total) return;
  if(now_ >= d.dotUntil){
    d.missed.push(d.idx);
    spawnDotSpark(lvl.dotsPoints[d.idx], false);
    advanceDot();
  }
}

/* ----- حرکتِ نقطهٔ نورانی و امتیازدهیِ لحظه‌ای در «ردِ نور» ----- */
function updateTrail(dt, now_){
  const tr = attempt.trail, lvl = currentLevel();
  if(!tr.started) return;

  if(tr.inGap){
    tr.gapElapsed += dt;
    if(tr.gapElapsed >= TRAIL_STROKE_GAP_MS){
      tr.inGap = false; tr.gapElapsed = 0;
      tr.segIndex++; tr.segElapsed = 0;
      if(tr.segIndex >= lvl.trailStrokes.length){ finishTrailLevel(); return; }
    }
    return;
  }

  tr.segElapsed += dt;
  const segDur = lvl.segDurations[tr.segIndex];
  const stroke = lvl.trailStrokes[tr.segIndex];
  const localT = clamp(tr.segElapsed/segDur, 0, 1);
  const pIdx = Math.min(stroke.length-1, Math.floor(localT*(stroke.length-1)));
  const cometPos = stroke[pIdx];
  tr.cometPos = cometPos;

  const zone = getPlayZone();
  const cometPx = fromNormalized(cometPos.x, cometPos.y, zone, false);
  const tolPx = Math.min(zone.width, zone.height)*lvl.toleranceR;
  let score = 0;
  tr.totalFrames++;
  if(tr.pointerDown && tr.pointerPos){
    const d = dist(tr.pointerPos.x, tr.pointerPos.y, cometPx.x, cometPx.y);
    score = clamp(1-d/tolPx, 0, 1);
    tr.downFrames++;
  }
  tr.accSum += score; tr.accFrames++;
  tr.liveAccuracy = score;
  if(score < 0.35){ tr.badStreakMs += dt; tr.worstBadStreakMs = Math.max(tr.worstBadStreakMs, tr.badStreakMs); }
  else tr.badStreakMs = 0;

  if(localT>=1){
    if(tr.segIndex < lvl.trailStrokes.length-1){ tr.inGap = true; tr.gapElapsed = 0; }
    else finishTrailLevel();
  }
}

function spawnDotSpark(pointNorm, hit){
  const zone = getPlayZone();
  const p = fromNormalized(pointNorm.x, pointNorm.y, zone, false);
  const color = hit ? '#ffd27a' : '#ff6f7d';
  for(let i=0;i<8;i++){
    const a = Math.random()*Math.PI*2, sp = 0.6+Math.random()*1.6;
    sparkBursts.push({x:p.x,y:p.y, vx:Math.cos(a)*sp,vy:Math.sin(a)*sp, life:0,maxLife:280+Math.random()*180, color, size:1.6+Math.random()*1.8});
  }
}

/* =====================================================================
   بخش ۹: سیستم ذرات (Particle System)
   سه نوع ذره داریم: ذرات محیطیِ همیشگیِ پس‌زمینه، ذرات سفر (نور در حال
   حرکت از چپ به راست طیِ ۲ ثانیه)، و جرقه‌های کوچک/بزرگ برای فرودِ
   پژواک و جشنِ اتمام مرحله.
   ===================================================================== */
const ambientParticles = [];
function initAmbientParticles(){
  ambientParticles.length = 0;
  for(let i=0;i<46;i++){
    ambientParticles.push({
      x: Math.random(), y: Math.random(),
      r: 0.6+Math.random()*1.8,
      speed: 0.05+Math.random()*0.09,
      phase: Math.random()*Math.PI*2,
      hue: Math.random()<0.5 ? 'blue':'gold'
    });
  }
}
function updateAmbientParticles(dt){
  ambientParticles.forEach(p=>{
    p.y -= p.speed*dt/1000;
    if(p.y < -0.05) p.y = 1.05;
    p.phase += dt*0.0022;
  });
}

let sparkBursts = [];
function spawnCompletionSparks(){
  const zones = getZoneRects();
  const cx = canvas.clientWidth/2, cy = zones.left.y + zones.left.height/2;
  const colors = ['#54c8ff','#ffd27a','#7bffb0','#ff9fb0','#c99bff'];
  for(let i=0;i<80;i++){
    const a = Math.random()*Math.PI*2, sp = 1.3+Math.random()*3.4;
    sparkBursts.push({
      x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.6,
      life:0, maxLife:750+Math.random()*550,
      color: colors[i%colors.length], size:2+Math.random()*3.2
    });
  }
}
function spawnLandingSpark(strokeIndex){
  if(!attempt) return;
  const zones = getZoneRects();
  const sObj = attempt.rightStrokes[strokeIndex];
  const arr = sObj && sObj.points;
  if(!arr || !arr.length) return;
  const last = arr[arr.length-1];
  const p = fromNormalized(last.x, last.y, zones.right, false);
  for(let i=0;i<6;i++){
    const a = Math.random()*Math.PI*2, sp = 0.5+Math.random()*1.4;
    sparkBursts.push({x:p.x,y:p.y, vx:Math.cos(a)*sp,vy:Math.sin(a)*sp, life:0,maxLife:260+Math.random()*160, color:'#ffd27a', size:1.4+Math.random()*1.6});
  }
}
function updateSparkBursts(dt){
  for(let i=sparkBursts.length-1;i>=0;i--){
    const s = sparkBursts[i];
    s.life += dt;
    s.x += s.vx*(dt/16); s.y += s.vy*(dt/16); s.vy += 0.05*(dt/16);
    if(s.life>=s.maxLife) sparkBursts.splice(i,1);
  }
}

/* =====================================================================
   بخش ۱۰: رندر بازی روی Canvas
   لایه‌بندی رسم: پس‌زمینهٔ کهکشانی → پنل‌های دو بخش → الگوی هدفِ
   نقطه‌چین (فقط در بخش راست؛ بخش چپ هیچ راهنمایی ندارد) → پیش‌نمایش
   نقطه‌چینِ پژواکِ در راه → خطوط درخشانِ رسم‌شده → ذرات در حال سفر →
   خط میانیِ نبض‌دار → جرقه‌ها.
   ===================================================================== */
function hexToRgbTuple(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return r+','+g+','+b;
}
function hexToRgba(hex, a){ return 'rgba('+hexToRgbTuple(hex)+','+a+')'; }
function shadeColor(hex, percent){
  const h = hex.replace('#','');
  let r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const mix = (c)=> Math.round(clamp(c+(255-c)*percent, 0, 255));
  return 'rgb('+mix(r)+','+mix(g)+','+mix(b)+')';
}

function render(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  drawBackground(w,h);

  if(currentScreen===SCREEN.PLAYING && attempt){
    const kind = modeKind();
    const modeDef = modeDefById(currentModeId);
    if(kind==='echo') renderEcho(modeDef);
    else if(kind==='memory') renderMemory(modeDef);
    else if(kind==='dots') renderDots(modeDef);
    else if(kind==='trail') renderTrail(modeDef);
    else if(kind==='duo') renderDuo(modeDef);
    else if(kind==='chain') renderChain(modeDef);
    else if(kind==='fill') renderFill(modeDef);
    else if(kind==='wind') renderWind(modeDef);
    else if(kind==='nolift' || kind==='noretrace') renderNoLift(modeDef);
  }
  drawSparkBursts();
  if(activeModal===MODAL.PAUSE){
    const w2=canvas.clientWidth, h2=canvas.clientHeight;
    ctx.save(); ctx.fillStyle='rgba(4,6,20,0.5)'; ctx.fillRect(0,0,w2,h2); ctx.restore();
  }
}

function renderEcho(modeDef){
  const zones = getZoneRects();
  drawZonePanel(zones.left, hexToRgbTuple(modeDef.colorA));
  drawZonePanel(zones.right, hexToRgbTuple(modeDef.colorB));
  if(currentLevelIndex < LEFT_GUIDE_TUTORIAL_LEVELS){
    drawGuide(currentLevel().leftTarget, zones.left);
    drawStartMarker(currentLevel().leftTarget, zones.left);
  }
  drawGuide(currentLevel().rightGuide, zones.right);
  drawStartMarker(currentLevel().rightGuide, zones.right);
  drawGhostPreview(zones, modeDef.colorB);
  drawGlowStrokes(attempt.liveStrokes, zones.left, false, shadeColor(modeDef.colorA,0.4), modeDef.colorA, false);
  drawGlowStrokes(attempt.rightStrokes, zones.right, false, shadeColor(modeDef.colorB,0.4), modeDef.colorB, false);
  drawTravelParticles();
  drawDivider(zones);
}

/* ----- رندرِ «ردِ حافظه» ----- */
function renderMemory(modeDef){
  const zone = getPlayZone();
  const m = attempt.memory, lvl = currentLevel();
  drawZonePanel(zone, hexToRgbTuple(modeDef.colorA));
  if(m.phase==='memorize'){
    drawGlowStrokes(lvl.shape.map(st=>({points:st})), zone, false, '#fff', modeDef.colorA, false);
    const remain = clamp((m.phaseUntil-nowMs())/lvl.memorizeMs, 0, 1);
    ctx.save();
    ctx.strokeStyle = hexToRgba(modeDef.colorA,0.7); ctx.lineWidth = 3;
    const cx = zone.x+zone.width-30, cy = zone.y+30, r=14;
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+remain*Math.PI*2); ctx.stroke();
    ctx.restore();
  } else if(m.phase==='ready'){
    ctx.save();
    ctx.globalAlpha = clamp((m.phaseUntil-nowMs())/450, 0, 1);
    ctx.fillStyle = '#fff';
    ctx.font = '700 22px var(--font-main)';
    ctx.textAlign = 'center'; ctx.textBaseline='middle';
    ctx.fillText('حالا بکش!', zone.x+zone.width/2, zone.y+zone.height/2);
    ctx.restore();
  }
  if(m.phase==='draw'){
    drawGlowStrokes(attempt.liveStrokes, zone, false, shadeColor(modeDef.colorB,0.4), modeDef.colorB, false);
  }
}

/* ----- رندرِ «شکار نقطه‌ها» ----- */
function renderDots(modeDef){
  const zone = getPlayZone();
  const d = attempt.dots, lvl = currentLevel();
  drawZonePanel(zone, hexToRgbTuple(modeDef.colorA));

  // مسیرِ نقطه‌های زده‌شده (شکل که کم‌کم کامل می‌شود)
  if(d.hitPoints.length>1){
    drawGlowStrokes([{points:d.hitPoints}], zone, false, shadeColor(modeDef.colorB,0.4), modeDef.colorB, false);
  }
  // همهٔ نقطه‌ها، کم‌رنگ
  ctx.save();
  lvl.dotsPoints.forEach((p,i)=>{
    if(i>=d.idx) return;
    const pp = fromNormalized(p.x,p.y,zone,false);
    ctx.beginPath(); ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.arc(pp.x,pp.y,3,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
  // نقطهٔ فعال با حلقهٔ روبه‌کوچک‌شدن
  if(d.idx < d.total){
    const target = lvl.dotsPoints[d.idx];
    const pp = fromNormalized(target.x, target.y, zone, false);
    const remain = clamp((d.dotUntil-nowMs())/d.curDotMs, 0, 1);
    const rBase = Math.max(30, Math.min(zone.width,zone.height)*lvl.dotToleranceR*1.6);
    ctx.save();
    ctx.shadowColor = modeDef.colorA; ctx.shadowBlur = 18;
    ctx.fillStyle = modeDef.colorA;
    ctx.beginPath(); ctx.arc(pp.x,pp.y,7,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = remain<0.3 ? 'rgba(255,111,125,0.9)' : hexToRgba(modeDef.colorB,0.85);
    ctx.beginPath(); ctx.arc(pp.x,pp.y, rBase, -Math.PI/2, -Math.PI/2 + remain*Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

/* ----- رندرِ «ردِ نور» ----- */
function renderTrail(modeDef){
  const zone = getPlayZone();
  const tr = attempt.trail, lvl = currentLevel();
  drawZonePanel(zone, hexToRgbTuple(modeDef.colorA));

  ctx.save();
  ctx.globalAlpha = 0.16;
  lvl.trailStrokes.forEach(st=> drawGlowStrokes([{points:st}], zone, false, '#fff', '#fff', false));
  ctx.restore();

  if(!tr.started){
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '600 15.5px var(--font-main)';
    ctx.textAlign = 'center'; ctx.textBaseline='middle';
    ctx.fillText('برای شروع، انگشتت را روی صفحه بگذار', zone.x+zone.width/2, zone.y+zone.height/2);
    ctx.restore();
    return;
  }
  if(attempt.finished) return;

  // نشانگرِ لمسِ بازیکن
  if(tr.pointerDown && tr.pointerPos){
    ctx.save();
    ctx.fillStyle = hexToRgba(modeDef.colorB, 0.5);
    ctx.beginPath(); ctx.arc(tr.pointerPos.x, tr.pointerPos.y, 14, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // خودِ نقطهٔ نورانی
  if(tr.cometPos && !tr.inGap){
    const cp = fromNormalized(tr.cometPos.x, tr.cometPos.y, zone, false);
    const glow = lerp(0.5, 1, tr.liveAccuracy||0);
    ctx.save();
    ctx.shadowColor = modeDef.colorA; ctx.shadowBlur = 24*glow;
    ctx.fillStyle = modeDef.colorA;
    ctx.beginPath(); ctx.arc(cp.x,cp.y, 9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ----- رندرِ «دو دستی»: دو نیمهٔ کاملاً مستقل، بدونِ پژواک -----
   اگر فقط یکی از دو طرف لمس شده باشد (و طرفِ مقابل هنوز نه)، به‌جای
   شروعِ کشیدن، هشدار می‌دهیم که باید هر دو طرف را هم‌زمان لمس کند. */
function renderDuo(modeDef){
  const zones = getZoneRects();
  const d = attempt.duo, lvl = currentLevel();
  drawZonePanel(zones.left, hexToRgbTuple(modeDef.colorA));
  drawZonePanel(zones.right, hexToRgbTuple(modeDef.colorB));
  drawGuide(lvl.leftShape, zones.left);
  drawStartMarker(lvl.leftShape, zones.left);
  drawGuide(lvl.rightShape, zones.right);
  drawStartMarker(lvl.rightShape, zones.right);
  drawGlowStrokes(d.leftStrokes, zones.left, false, shadeColor(modeDef.colorA,0.4), modeDef.colorA, false);
  drawGlowStrokes(d.rightStrokes, zones.right, false, shadeColor(modeDef.colorB,0.4), modeDef.colorB, false);
  drawDivider(zones);

  const onlyLeftTouched  = d.leftPointerId!==null  && d.rightPointerId===null;
  const onlyRightTouched = d.rightPointerId!==null && d.leftPointerId===null;
  if(onlyLeftTouched || onlyRightTouched){
    const waitingZone = onlyLeftTouched ? zones.right : zones.left;
    const pulse = 0.72 + 0.22*Math.sin(nowMs()/220);
    ctx.save();
    roundRectPath(waitingZone.x, waitingZone.y, waitingZone.width, waitingZone.height, 22);
    ctx.fillStyle = `rgba(255,111,125,${0.10*pulse})`;
    ctx.fill();
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = `rgba(255,111,125,${0.55*pulse})`;
    ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${0.85*pulse})`;
    ctx.font = '700 15px var(--font-main)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('این طرف رو هم لمس کن!', waitingZone.x+waitingZone.width/2, waitingZone.y+waitingZone.height/2 - 14);
    ctx.font = '600 12.5px var(--font-main)';
    ctx.fillStyle = `rgba(255,255,255,${0.62*pulse})`;
    ctx.fillText('باید هم‌زمان با دو انگشت بکشی', waitingZone.x+waitingZone.width/2, waitingZone.y+waitingZone.height/2 + 12);
    ctx.restore();
  }
}

/* ----- رندرِ «خط به خط»: فقط خطِ فعلی نمایان است -----
   خط‌های تاییدشده (attempt.liveStrokes با ایندکسِ کمتر از curIdx) با
   رنگِ اصلیِ مدل رسم می‌شوند تا شکل، رفته‌رفته، جلوی چشمِ بازیکن کامل
   شود. نقطه‌چین و نشانگرِ شروع فقط برای خطِ هدفِ همین لحظه (curIdx)
   نشان داده می‌شود -- بقیه‌ی شکل هنوز اصلاً فاش نشده. */
function renderChain(modeDef){
  const zone = getPlayZone();
  const lvl = currentLevel(), c = attempt.chain;
  drawZonePanel(zone, hexToRgbTuple(modeDef.colorA));

  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '700 13.5px var(--font-main)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('خطِ '+toFa(Math.min(c.curIdx+1,lvl.strokesRequired))+' از '+toFa(lvl.strokesRequired), zone.x+zone.width/2, zone.y+22);
  ctx.restore();

  if(c.curIdx < lvl.strokesRequired){
    const targetStroke = lvl.shape[c.curIdx];
    drawGuide([targetStroke], zone);
    drawStartMarker([targetStroke], zone);
  }

  drawGlowStrokes(attempt.liveStrokes, zone, false, shadeColor(modeDef.colorB,0.4), modeDef.colorB, false);

  if(attempt.chain.rejectUntil > nowMs()){
    const pulse = 0.7 + 0.25*Math.sin(nowMs()/150);
    ctx.save();
    ctx.fillStyle = `rgba(255,255,255,${0.9*pulse})`;
    ctx.font = '700 15px var(--font-main)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('این‌طوری نه؛ دوباره امتحان کن', zone.x+zone.width/2, zone.y+zone.height/2);
    ctx.restore();
  }
}

/* ----- رندرِ «رنگ‌آمیزیِ سایه»: سایهٔ کم‌رنگِ راهنما + لکه‌های رنگ ----- */
function renderFill(modeDef){
  const zone = getPlayZone();
  const lvl = currentLevel(), f = attempt.fill;
  const messy = f.comboWindow.length>=6 && (f.comboWindow.filter(Boolean).length/f.comboWindow.length) < 0.5;
  drawZonePanel(zone, hexToRgbTuple(modeDef.colorA));

  if(messy){
    const pulse = 0.5+0.5*Math.sin(nowMs()/120);
    ctx.save();
    roundRectPath(zone.x, zone.y, zone.width, zone.height, 22);
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(255,111,125,${0.35+0.35*pulse})`;
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = 0.4;
  drawGuide(lvl.shape, zone);
  ctx.restore();

  const innerW = zone.width - zone.pad*2, innerH = zone.height - zone.pad*2;
  const brushPx = (lvl.brushR||FILL_BRUSH_R_DEFAULT)*2*Math.min(innerW, innerH);
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalAlpha = 0.6;
  ctx.strokeStyle = modeDef.colorB;
  ctx.fillStyle = modeDef.colorB;
  ctx.lineWidth = brushPx;
  attempt.liveStrokes.forEach(st=>{
    if(!st || !st.points.length) return;
    if(st.points.length===1){
      const p = fromNormalized(st.points[0].x, st.points[0].y, zone, false);
      ctx.beginPath(); ctx.arc(p.x,p.y,brushPx/2,0,Math.PI*2); ctx.fill();
      return;
    }
    ctx.beginPath();
    st.points.forEach((p,i)=>{
      const pp = fromNormalized(p.x,p.y,zone,false);
      if(i===0) ctx.moveTo(pp.x,pp.y); else ctx.lineTo(pp.x,pp.y);
    });
    ctx.stroke();
  });
  ctx.restore();

  const fillMask = getFillMask(lvl);
  const coverage = clamp(f.paintedInsideCount/fillMask.insideCount, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.78)';
  ctx.font = '700 13.5px var(--font-main)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('پر شده: ٪'+toFa(Math.round(coverage*100)), zone.x+zone.width/2, zone.y+22);
  ctx.restore();

  if(messy){
    ctx.save();
    ctx.fillStyle = 'rgba(255,111,125,0.9)';
    ctx.font = '600 11.5px var(--font-main)';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText('یواش‌تر؛ داری از خط بیرون می‌زنی', zone.x+zone.width/2, zone.y+zone.height-14);
    ctx.restore();
  }
}

/* ----- رندرِ «بومِ بادی»: راهنمای نوسان‌کننده + ضربه‌های رسم‌شده ----- */
function renderWind(modeDef){
  const zone = getPlayZone();
  const lvl = currentLevel();
  drawZonePanel(zone, hexToRgbTuple(modeDef.colorA));
  const animatedShape = windOffsetForShape(lvl.shape, nowMs(), lvl);
  drawGuide(animatedShape, zone);
  drawStartMarker(lvl.shape, zone);
  drawGlowStrokes(attempt.liveStrokes, zone, false, shadeColor(modeDef.colorB,0.4), modeDef.colorB, false);
}

/* ----- رندرِ «بی‌وقفه» و «بی‌بازگشت»: نقطه‌چینِ ثابت + ضربهٔ در حالِ کشیدن ----- */
function renderNoLift(modeDef){
  const zone = getPlayZone();
  const lvl = currentLevel();
  drawZonePanel(zone, hexToRgbTuple(modeDef.colorA));
  drawGuide(lvl.shape, zone);
  drawStartMarker(lvl.shape, zone);
  drawGlowStrokes(attempt.liveStrokes, zone, false, shadeColor(modeDef.colorB,0.4), modeDef.colorB, false);
}

function drawBackground(w,h){
  const g = ctx.createLinearGradient(0,0,w*0.3,h);
  g.addColorStop(0,   '#070a20');
  g.addColorStop(0.42,'#1b0f43');
  g.addColorStop(0.72,'#33165f');
  g.addColorStop(1,   '#4c2280');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);

  const glow1 = ctx.createRadialGradient(w*0.18,h*0.12,0, w*0.18,h*0.12, w*0.55);
  glow1.addColorStop(0,'rgba(84,200,255,0.10)'); glow1.addColorStop(1,'rgba(84,200,255,0)');
  ctx.fillStyle = glow1; ctx.fillRect(0,0,w,h);
  const glow2 = ctx.createRadialGradient(w*0.85,h*0.92,0, w*0.85,h*0.92, w*0.6);
  glow2.addColorStop(0,'rgba(255,210,122,0.10)'); glow2.addColorStop(1,'rgba(255,210,122,0)');
  ctx.fillStyle = glow2; ctx.fillRect(0,0,w,h);

  ctx.save();
  ambientParticles.forEach(p=>{
    const px = p.x*w, py = p.y*h;
    const tw = 0.5+0.5*Math.sin(p.phase);
    ctx.globalAlpha = 0.32*tw;
    ctx.fillStyle = p.hue==='blue' ? '#8fe3ff' : '#ffe4a3';
    ctx.beginPath(); ctx.arc(px,py,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawZonePanel(zone, color){
  ctx.save();
  roundRectPath(zone.x, zone.y, zone.width, zone.height, 22);
  ctx.fillStyle = `rgba(${color},0.055)`;
  ctx.fill();
  ctx.lineWidth = 2.2;
  ctx.strokeStyle = `rgba(${color},0.8)`;
  ctx.shadowColor = `rgba(${color},0.85)`;
  ctx.shadowBlur = 15;
  ctx.stroke();
  ctx.restore();
}

function drawGuide(shape, zone){
  ctx.save();
  ctx.setLineDash([6,7]);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  shape.forEach(stroke=>{
    ctx.beginPath();
    stroke.forEach((p,i)=>{
      const pp = fromNormalized(p.x,p.y,zone,false);
      if(i===0) ctx.moveTo(pp.x,pp.y); else ctx.lineTo(pp.x,pp.y);
    });
    ctx.stroke();
  });
  ctx.restore();
}

/* نشانگرِ دقیقِ نقطهٔ شروع، مستقیم روی خودِ بومِ بازی: یک نقطهٔ سفیدِ
   چشمک‌زن دقیقاً روی اولین نقطهٔ شکلِ نقطه‌چین (همان‌جا که انگشت باید
   بنشیند)، به‌همراه یک فلشِ کوتاه که جهتِ اولین حرکت را نشان می‌دهد —
   جوابِ مستقیمِ «از کجای صفحه شروع کنم؟» است. */
function drawStartMarker(shape, zone){
  if(!shape || !shape.length || !shape[0].length) return;
  const p0 = shape[0][0];
  const p1 = shape[0][1] || shape[0][0];
  const pos = fromNormalized(p0.x, p0.y, zone, false);
  const dirPos = fromNormalized(p1.x, p1.y, zone, false);
  const pulse = 0.5+0.5*Math.sin(nowMs()/280);

  ctx.save();
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 8+pulse*5, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,'+(0.12+pulse*0.16).toFixed(3)+')';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 5, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(255,255,255,0.9)';
  ctx.shadowBlur = 9;
  ctx.fill();
  ctx.shadowBlur = 0;

  if(dist(pos.x,pos.y,dirPos.x,dirPos.y) > 2){
    const ang = Math.atan2(dirPos.y-pos.y, dirPos.x-pos.x);
    const arrowLen = 22;
    const ax = pos.x+Math.cos(ang)*arrowLen, ay = pos.y+Math.sin(ang)*arrowLen;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pos.x,pos.y); ctx.lineTo(ax,ay); ctx.stroke();
    const h1 = ang+Math.PI-0.4, h2 = ang+Math.PI+0.4;
    ctx.beginPath();
    ctx.moveTo(ax,ay); ctx.lineTo(ax+Math.cos(h1)*7, ay+Math.sin(h1)*7);
    ctx.moveTo(ax,ay); ctx.lineTo(ax+Math.cos(h2)*7, ay+Math.sin(h2)*7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGhostPreview(zones, color){
  if(!attempt || !attempt.echoQueue.length) return;
  ctx.save();
  ctx.fillStyle = hexToRgba(color||'#ffd27a', 0.5);
  attempt.echoQueue.forEach(ev=>{
    const p = fromNormalized(ev.echoed.x, ev.echoed.y, zones.right, false);
    ctx.beginPath(); ctx.arc(p.x,p.y,2.1,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

function wobblePoint(pp, i){
  const tt = nowMs()*0.006 + i*1.7;
  return { x: pp.x + Math.sin(tt)*2.2, y: pp.y + Math.cos(tt*1.3)*2.2 };
}
function strokePath(points, zone, mirrored, wobble){
  if(points.length===1){
    let p = fromNormalized(points[0].x,points[0].y,zone,mirrored);
    if(wobble) p = wobblePoint(p,0);
    ctx.beginPath(); ctx.arc(p.x,p.y,ctx.lineWidth/2,0,Math.PI*2); ctx.fillStyle=ctx.strokeStyle; ctx.fill();
    return;
  }
  ctx.beginPath();
  points.forEach((p,i)=>{
    let pp = fromNormalized(p.x,p.y,zone,mirrored);
    if(wobble) pp = wobblePoint(pp,i);
    if(i===0) ctx.moveTo(pp.x,pp.y); else ctx.lineTo(pp.x,pp.y);
  });
  ctx.stroke();
}

function drawGlowStrokes(strokes, zone, mirrored, coreColor, glowColor, wobble){
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  strokes.forEach(st=>{
    if(!st || !st.points || st.points.length<1) return;
    ctx.shadowColor = glowColor; ctx.shadowBlur = 15;
    ctx.strokeStyle = glowColor; ctx.lineWidth = 7.5; ctx.globalAlpha = 0.5;
    strokePath(st.points, zone, mirrored, wobble);
    ctx.shadowBlur = 0; ctx.strokeStyle = coreColor; ctx.lineWidth = 3.2; ctx.globalAlpha = 1;
    strokePath(st.points, zone, mirrored, wobble);
  });
  ctx.restore();
}

function drawTravelParticles(){
  if(!attempt) return;
  const now_ = nowMs();
  ctx.save();
  for(let i=attempt.travelParticles.length-1;i>=0;i--){
    const tp = attempt.travelParticles[i];
    const p = (now_-tp.startTime)/tp.duration;
    if(p>=1){ attempt.travelParticles.splice(i,1); continue; }
    const bow = Math.sin(p*Math.PI)*16;
    const x = lerp(tp.from.x, tp.to.x, p);
    const y = lerp(tp.from.y, tp.to.y, p) - bow;
    ctx.globalAlpha = 0.85*(1-Math.abs(p-0.5)*0.4);
    const grad = ctx.createRadialGradient(x,y,0,x,y,7);
    grad.addColorStop(0,'rgba(255,255,255,0.9)');
    grad.addColorStop(0.4,'rgba(190,220,255,0.6)');
    grad.addColorStop(1,'rgba(190,220,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawDivider(zones){
  const x = zones.left.x+zones.left.width + zones.gap/2;
  const y1 = zones.left.y, y2 = zones.left.y+zones.left.height;
  const t = (Math.sin(nowMs()*0.003)+1)/2;
  const grad = ctx.createLinearGradient(0,y1,0,y2);
  grad.addColorStop(0,  'rgba(255,255,255,0)');
  grad.addColorStop(0.5,`rgba(255,255,255,${(0.16+0.12*t).toFixed(3)})`);
  grad.addColorStop(1,  'rgba(255,255,255,0)');
  ctx.save();
  ctx.strokeStyle = grad; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2); ctx.stroke();
  ctx.restore();
}

function drawSparkBursts(){
  ctx.save();
  sparkBursts.forEach(s=>{
    const a = 1-(s.life/s.maxLife);
    ctx.globalAlpha = Math.max(0,a);
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

/* =====================================================================
   بخش ۱۱: امتیازدهی و محاسبهٔ ستاره‌ها (Scoring)
   دقتِ هر بخش با نمونه‌برداریِ یکنواخت از مسیرِ هدف و اندازه‌گیریِ
   نزدیک‌ترین فاصله تا مسیرِ رسم‌شدهٔ متناظر محاسبه می‌شود.
   ===================================================================== */
/* این عدد قبلاً ۵۵ بود -- یعنی حتی اگر نصفِ شکل را نکشیده بودی، یا
   نصفِ خطی که کشیده بودی کاملاً بیرون از مسیرِ هدف بود، بازهم به‌راحتی
   رد می‌شدی. حالا برای رد شدن باید واقعاً بیشترِ شکل را، نزدیک به
   مسیرِ هدف، کشیده باشی. */
const MIN_PASS_ACCURACY = 72;
const STAR_ACCURACY_THRESHOLD = 85;

function sampleStrokeEvenly(stroke, count){
  if(stroke.length===0) return [];
  const lens=[0];
  for(let i=1;i<stroke.length;i++) lens.push(lens[i-1]+dist(stroke[i-1].x,stroke[i-1].y,stroke[i].x,stroke[i].y));
  const total = lens[lens.length-1];
  const out=[];
  if(total===0){ for(let i=0;i<count;i++) out.push(stroke[0]); return out; }
  for(let i=0;i<count;i++){
    const target = total*(i/(count-1));
    let seg=0; while(seg<lens.length-2 && lens[seg+1]<target) seg++;
    const segLen = lens[seg+1]-lens[seg];
    const localT = segLen>0 ? (target-lens[seg])/segLen : 0;
    out.push({ x: lerp(stroke[seg].x, stroke[seg+1].x, localT), y: lerp(stroke[seg].y, stroke[seg+1].y, localT) });
  }
  return out;
}
function nearestDist(pt, pathPoints){
  let best = Infinity;
  for(let i=0;i<pathPoints.length;i++){
    const d = dist(pt.x,pt.y,pathPoints[i].x,pathPoints[i].y);
    if(d<best) best=d;
  }
  return best;
}
function scoreSide(targetShape, drawnStrokes, tolerance){
  const SAMPLES = 18;
  /* باگ‌فیکس ۱: قبلاً امتیازدهی بر اساسِ ایندکسِ ضربه بود (ضربه‌ی اولِ
     بازیکن باید دقیقاً معادلِ ضربه‌ی اولِ شکلِ هدف باشد، دومی معادلِ
     دومی، و...). این یعنی اگر بازیکن شکل را با ترتیب یا تعداد ضربه‌ی
     متفاوتی می‌کشید (مثلاً برای شکلِ خانه: دیوار/سقف/در را در ترتیبی
     غیر از ترتیبِ داخلیِ کد می‌کشید، یا دو تکه را با هم و بدون بلند
     کردنِ انگشت می‌کشید)، برای آن تکه‌ها امتیازِ صفر می‌گرفت -- حتی
     اگر ظاهراً کاملاً روی نقطه‌چین کشیده بود. حالا همه‌ی نقاطِ کشیده‌شده
     (از هر ضربه‌ای) با هم در یک استخر جمع می‌شوند و فقط نزدیکیِ هر
     نقطه‌ی هدف به نزدیک‌ترین نقطه‌ی کشیده‌شده (فارغ از تعلق به کدام
     ضربه) سنجیده می‌شود.

     باگ‌فیکس ۲ (مهم‌تر): امتیازدهیِ قبلی فقط یک‌طرفه بود -- فقط
     می‌سنجید که آیا هر نقطه‌ی «هدف» یک نقطه‌ی کشیده‌شده در نزدیکی‌اش
     دارد یا نه (recall). این یعنی خط‌خطی‌کردنِ یک ناحیه‌ی بزرگ که
     تصادفاً همه‌ی شکلِ هدف را هم پوشش می‌داد، امتیازِ کامل می‌گرفت --
     چون هیچ‌چیز بابتِ جوهرِ اضافه و بیرون از مسیر جریمه نمی‌شد. حالا
     جهتِ دوم هم سنجیده می‌شود (precision): هر نقطه‌ای که بازیکن کشیده
     باید خودش هم به یک نقطه‌ی «هدف» نزدیک باشد. امتیازِ نهایی میانگینِ
     هارمونیکِ این دو (شبیه F1-score) است، پس فقط زمانی بالا می‌رود که
     هم کلِ شکل پوشانده شده باشد و هم خطِ کشیده‌شده از مسیرِ هدف بیرون
     نزده باشد. */
  const allDrawnPoints = [];
  drawnStrokes.forEach(s=>{ if(s && s.points) allDrawnPoints.push(...s.points); });

  const targetPoints = [];
  let hit=0, total=0;
  targetShape.forEach(targetStroke=>{
    const samples = sampleStrokeEvenly(targetStroke, SAMPLES);
    targetPoints.push(...samples);
    samples.forEach(s=>{
      total++;
      if(allDrawnPoints.length>0 && nearestDist(s, allDrawnPoints) <= tolerance) hit++;
    });
  });
  const recall = total>0 ? hit/total : 0;

  let precisionHit=0, precisionTotal=0;
  if(allDrawnPoints.length>0 && targetPoints.length>0){
    /* روی نقاطِ خامِ کشیده‌شده به‌طورِ یکنواخت نمونه‌برداری می‌کنیم تا
       هم هزینه‌ی محاسبه محدود بماند و هم چگالیِ نقاطِ pointermove
       (که جای مکث انگشت زیاد می‌شود) نتیجه را کج نکند. */
    const PRECISION_SAMPLES = 40;
    const step = Math.max(1, Math.floor(allDrawnPoints.length/PRECISION_SAMPLES));
    for(let i=0;i<allDrawnPoints.length;i+=step){
      precisionTotal++;
      if(nearestDist(allDrawnPoints[i], targetPoints) <= tolerance) precisionHit++;
    }
  }
  const precision = precisionTotal>0 ? precisionHit/precisionTotal : (allDrawnPoints.length>0 ? 0 : 1);

  /* دقتِ گوشه‌ها: نمونه‌برداریِ یکنواختِ بالا طولِ مسیر را یکسان تقسیم
     می‌کند، پس در شکل‌هایی که چند گوشهٔ تیز و چند خطِ صافِ نسبتاً بلند
     بینِ آن‌ها دارند (زیگزاگ، ستاره، چندضلعی، پیکان، خانه)، بیشترِ آن
     ۱۸ نمونه روی همان خط‌های صاف می‌افتد، نه دقیقاً روی خودِ گوشه. پس
     یک خطِ نسبتاً صاف که فقط از وسطِ شکل رد شود و هرگز واقعاً به نوکِ
     گوشه‌ها نرسد، همچنان می‌توانست recall و precision بالایی بگیرد.
     اینجا خودِ نقاطِ اصلیِ تعریف‌شدهٔ هر ضربه (که برای این شکل‌ها همان
     گوشه‌ها هستند) را جدا، با سخت‌گیریِ بیشتر، می‌سنجیم -- اگر بازیکن
     واقعاً به گوشه‌ها نرسیده باشد، این عدد پایین می‌ماند و امتیازِ کل
     را (چون میانگینِ هارمونیک است) به‌شدت پایین می‌کشد. */
  let cornerHit=0, cornerTotal=0;
  const cornerTolerance = tolerance*0.7;
  targetShape.forEach(targetStroke=>{
    targetStroke.forEach(cp=>{
      cornerTotal++;
      if(allDrawnPoints.length>0 && nearestDist(cp, allDrawnPoints) <= cornerTolerance) cornerHit++;
    });
  });
  const cornerAcc = cornerTotal>0 ? cornerHit/cornerTotal : 1;

  const parts = [recall, precision, cornerAcc];
  const overall = parts.every(p=>p>0) ? (parts.length/parts.reduce((s,p)=>s+1/p,0)) : 0;
  return overall*100;
}
function computeStars(elapsedMs, level, overallAccuracy, strokesUsed){
  const speedStar      = elapsedMs <= level.parTimeMs ? 1:0;
  const accuracyStar   = overallAccuracy >= STAR_ACCURACY_THRESHOLD ? 1:0;
  const efficiencyStar = strokesUsed <= level.strokesRequired ? 1:0;
  return speedStar+accuracyStar+efficiencyStar;
}

/* =====================================================================
   بخش ۱۲: دستاوردها (Achievements)
   ===================================================================== */
const ACHIEVEMENT_META = {
  beginner:    {title:'نقاش مبتدی',           desc:'اولین مرحله را کامل کردی.'},
  delayMaster: {title:'استاد تأخیر',           desc:'اولین مرحلهٔ متقاطع (۲۰) را رد کردی.'},
  coordinator: {title:'هماهنگ‌کنندهٔ حرفه‌ای', desc:'هر ۴۰ مرحلهٔ یک مدلِ بازی را کامل کردی.'}
};
function checkAchievements(levelIndex){
  const out=[];
  if(levelIndex===0 && !GameData.achievements.beginner){ GameData.achievements.beginner=true; out.push({key:'beginner'}); }
  if(modeKind()==='echo' && levelIndex===19 && !GameData.achievements.delayMaster){ GameData.achievements.delayMaster=true; out.push({key:'delayMaster'}); }
  if(levelIndex===getLevels().length-1 && !GameData.achievements.coordinator){ GameData.achievements.coordinator=true; out.push({key:'coordinator'}); }
  return out;
}

/* خطِ پایانِ مشترکِ همهٔ مدل‌های بازی: ذخیرهٔ ستاره، باز کردنِ مرحلهٔ بعد،
   بررسیِ دستاوردها، و نمایشِ صفحهٔ پایانِ مرحله. هر مدل، ستاره و دقتِ
   خودش را طبقِ قوانینِ خودش حساب می‌کند و فقط همین تابع را صدا می‌زند. */
function finalizeLevel(stars, overallAccuracy){
  attempt.finished = true;
  attempt.completedAt = nowMs();
  attempt.result = { overallAccuracy, stars };
  const prog = GameData.modes[currentModeId];
  if(stars > (prog.stars[currentLevelIndex]||0)) prog.stars[currentLevelIndex] = stars;
  if(currentLevelIndex+1 >= prog.unlockedCount) prog.unlockedCount = Math.min(getLevels().length, currentLevelIndex+2);
  const newAch = checkAchievements(currentLevelIndex);
  saveGameData();
  SFX.levelComplete();
  spawnCompletionSparks();
  renderCompleteScreen(stars, overallAccuracy);
  setModal(MODAL.COMPLETE);
  maybeShowAd(); /* برد مرحله: با ۳۵٪ احتمال، تبلیغ نشان بده (اگر VIP نباشد) */
  /* محافظِ اضافه در برابر کلیکِ شَبَحِ همان لمسی که مرحله را کامل کرد:
     دکمه‌های این صفحه را برای یک لحظهٔ کوتاه نسبت به کلیک بی‌تفاوت
     می‌کنیم تا اگر با همهٔ تمهیداتِ دیگر هم رویدادِ جعلی‌ای رسید، به
     هیچ دکمه‌ای نخورَد. */
  const completeActions = document.querySelector('.complete-actions');
  if(completeActions){
    completeActions.style.pointerEvents = 'none';
    setTimeout(()=>{ completeActions.style.pointerEvents = ''; }, 400);
  }
  newAch.forEach((a,i)=> setTimeout(()=>showAchievementToast(a), 1100+i*1500));
}

function completeLevel(leftAcc, rightAcc, overallAccuracy){
  const elapsed = nowMs() - attempt.startTime;
  const stars = computeStars(elapsed, currentLevel(), overallAccuracy, attempt.strokesUsed);
  finalizeLevel(stars, overallAccuracy);
}

function completeMemoryLevel(accuracy){
  const elapsed = nowMs() - (attempt.memory.drawStartTime||attempt.startTime);
  const stars = computeStars(elapsed, currentLevel(), accuracy, attempt.strokesUsed);
  finalizeLevel(stars, accuracy);
}

/* ----- منطقِ «شکار نقطه‌ها» ----- */
function registerDotHit(){
  const d = attempt.dots, lvl = currentLevel();
  const now_ = nowMs();
  const reactionMs = now_ - d.lastDotStart;
  d.reactionRatios.push(clamp(reactionMs/d.curDotMs, 0, 1));
  d.hitPoints.push(lvl.dotsPoints[d.idx]);
  d.hits++;
  SFX.echoLand();
  spawnDotSpark(lvl.dotsPoints[d.idx], true);
  advanceDot();
}
function advanceDot(){
  const d = attempt.dots, lvl = currentLevel();
  d.idx++;
  if(d.idx>=d.total){ finishDotsLevel(); return; }
  const now_ = nowMs();
  d.lastDotStart = now_;
  d.curDotMs = dotDurationFor(lvl, d.idx);
  d.dotUntil = now_ + d.curDotMs;
}
function finishDotsLevel(){
  const d = attempt.dots;
  const hitRatio = d.total>0 ? (d.hits/d.total)*100 : 0;
  const avgReaction = d.reactionRatios.length ? d.reactionRatios.reduce((a,b)=>a+b,0)/d.reactionRatios.length : 1;
  const accuracyStar = hitRatio >= STAR_ACCURACY_THRESHOLD ? 1:0;
  const speedStar = avgReaction <= 0.55 ? 1:0;
  const efficiencyStar = d.missed.length===0 ? 1:0;
  finalizeLevel(accuracyStar+speedStar+efficiencyStar, hitRatio);
}

/* ----- منطقِ «ردِ نور» ----- */
function finishTrailLevel(){
  const tr = attempt.trail;
  const overall = tr.accFrames>0 ? (tr.accSum/tr.accFrames)*100 : 0;
  const presenceRatio = tr.totalFrames>0 ? tr.downFrames/tr.totalFrames : 0;
  const presenceStar = presenceRatio >= 0.85 ? 1:0;
  const accuracyStar = overall >= STAR_ACCURACY_THRESHOLD ? 1:0;
  const steadyStar = tr.worstBadStreakMs <= 550 ? 1:0;
  finalizeLevel(presenceStar+accuracyStar+steadyStar, overall);
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const appEl = document.getElementById('app');

function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

function setScreen(s){
  currentScreen = s; appEl.dataset.screen = s;
  if(s===SCREEN.MENU) applyModeTheme('classic');
}
function setModal(m){ activeModal = m; if(m) appEl.dataset.modal = m; else delete appEl.dataset.modal; }

function applyModeTheme(modeId){
  const m = modeDefById(modeId);
  const root = document.documentElement.style;
  root.setProperty('--echo-blue', m.colorA);
  root.setProperty('--echo-gold', m.colorB);
  root.setProperty('--echo-blue-deep', shadeColor(m.colorA,-0.25));
  root.setProperty('--echo-gold-deep', shadeColor(m.colorB,-0.25));
  root.setProperty('--echo-blue-soft', hexToRgba(m.colorA,0.14));

function updateLevelScreenHeader(){

function enterModeLevels(modeId){

  levelSelectOrigin = 'modes';

/* ----- آیکون‌های SVG سبک (به‌جای ایموجیِ پیش‌فرض) ----- */
function starFilledSvg(){ return '<svg viewBox="0 0 24 24" class="ic-star"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.2l7.1-.6z" fill="currentColor"/></svg>'; }

/* ----- شروع / بازنشانی / مکث یک مرحله ----- */
/* راهنمای هر مرحله (بجِ چرخش + نکتهٔ پایینِ صفحه) پیش‌فرض بسته است تا
   وسطِ بومِ نقاشی نیفتد؛ فقط با زدنِ دکمهٔ «آموزش مرحله» باز می‌شود و با
   شروعِ هر مرحلهٔ جدید، دوباره خودش را می‌بندد. */
function setLevelTutorialOpen(open){
  const stack = document.getElementById('levelInfoStack');
  const btn = document.getElementById('btnLevelTutorial');
  stack.classList.toggle('open', open);
  btn.classList.toggle('active', open);
}
function startLevel(idx){
  currentLevelIndex = idx;
  attempt = makeAttempt(idx);
  setModal(MODAL.NONE);
  setScreen(SCREEN.PLAYING);
  setLevelTutorialOpen(false);
  updateHUD();
  const prog = GameData.modes[currentModeId];
  if(!prog.seenIntro){
    prog.seenIntro = true; GameData.seenTutorial = true; saveGameData();
    attempt.pausedAt = nowMs(); // زمان تا وقتی راهنما باز است شمارش نشود
    openHelp();
  } else if(modeKind()==='echo' && idx===19 && !GameData.seenCrossedIntro){
    GameData.seenCrossedIntro = true; saveGameData();
    showCrossedIntroToast();
  }
}
function resetAttempt(){
  if(!attempt) return;
  SFX.tap();
  attempt = makeAttempt(currentLevelIndex);
}
function pauseGame(){
  if(currentScreen!==SCREEN.PLAYING || activeModal) return;
  if(attempt) attempt.pausedAt = nowMs();
  setModal(MODAL.PAUSE);
}
function unpauseAttemptClock(){
  if(attempt && attempt.pausedAt){
    const delta = nowMs()-attempt.pausedAt;
    attempt.startTime += delta;
    attempt.echoQueue.forEach(ev=> ev.replayAt += delta);
    attempt.travelParticles.forEach(tp=> tp.startTime += delta);
    if(attempt.memory){ attempt.memory.phaseUntil += delta; if(attempt.memory.drawStartTime) attempt.memory.drawStartTime += delta; }
    if(attempt.dots){ attempt.dots.dotUntil += delta; attempt.dots.lastDotStart += delta; }
    if(attempt.duo){
      if(attempt.duo.leftStartTime) attempt.duo.leftStartTime += delta;
      if(attempt.duo.rightStartTime) attempt.duo.rightStartTime += delta;
    }
    attempt.pausedAt = 0;
  }
}
function resumeGame(){
  unpauseAttemptClock();
  setModal(MODAL.NONE);
}

/* ----- رویدادهای اشاره‌گر روی کانواس (لمسی + ماوس، یکپارچه) ----- */
canvas.style.touchAction = 'none';
/* توجه: e.preventDefault() این‌جا حیاتی است. بدون آن، مرورگر بعد از
   هر لمس یک رویدادِ «کلیک» جبرانی/شَبَح (ghost click) هم شبیه‌سازی
   می‌کند. در حالتِ «شکار نقطه‌ها»، زدنِ آخرین نقطه همان لحظه صفحهٔ
   «مرحله کامل شد» را باز می‌کند؛ اگر آن نقطه دقیقاً زیرِ یکی از دکمه‌های
   آن صفحه (مثلاً «بازگشت به منو») بیفتد، همان کلیکِ شَبَح روی دکمه
   می‌خورَد و بازیکن را -- بدون دیدن صفحهٔ برد -- مستقیم به منو پرت
   می‌کند. preventDefault جلوِ ساخته‌شدنِ آن کلیکِ جعلی را می‌گیرد. */
canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  handlePointerDown(e.clientX-r.left, e.clientY-r.top, e.pointerId);
}, {passive:false});
canvas.addEventListener('pointermove', e=>{
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  handlePointerMove(e.clientX-r.left, e.clientY-r.top, e.pointerId);
}, {passive:false});
window.addEventListener('pointerup', e=> handlePointerUp(e.pointerId));
window.addEventListener('pointercancel', e=> handlePointerUp(e.pointerId));
canvas.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.scale && e.scale!==1) e.preventDefault(); }, {passive:false});

function renderLevelGrid(){
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  const prog = GameData.modes[currentModeId];
  getLevels().forEach((lv, i)=>{
    const unlocked = i < prog.unlockedCount;
    const stars = prog.stars[i]||0;
    const btn = document.createElement('button');
    btn.className = 'level-node' + (unlocked?'':' locked') + (lv.crossed?' crossed':'');
    /* برای گریدهای بزرگ (تا ۴۰ خانه) تأخیر را بعد از چند خانهٔ اول
       صاف می‌کنیم تا هم حسِ آبشاری داشته باشد و هم لود شدنِ کل صفحه
       روی گوشی‌های ضعیف کند به نظر نرسد. */
    btn.style.animationDelay = (Math.min(i,10)*16)+'ms';
    btn.innerHTML = unlocked
      ? '<span class="lvl-num">'+toFa(i+1)+'</span><span class="lvl-stars">'+starIcons(stars)+'</span>'
      : lockIconSvg();
    if(unlocked) btn.addEventListener('click', ()=>{ SFX.tap(); startLevel(i); });
    grid.appendChild(btn);
  });
}

/* رسمِ کمانِ SVG از زاویهٔ ۰ (بالا، دوازدهِ ساعت) تا زاویهٔ دلخواه، با
   جهتِ چرخش به‌صورتِ خودکار (کمان به‌جای واژه‌ی «ساعتگرد»/«پادساعتگرد»،
   خودش با شکل و فلشِ انتهایش نشان می‌دهد کدام‌طرف باید چرخید). */
function describeArc(cx, cy, r, theta0Deg, theta1Deg){
  const t0 = theta0Deg*Math.PI/180, t1 = theta1Deg*Math.PI/180;
  const x0 = cx + r*Math.sin(t0), y0 = cy - r*Math.cos(t0);
  const x1 = cx + r*Math.sin(t1), y1 = cy - r*Math.cos(t1);
  const delta = theta1Deg-theta0Deg;
  const largeArc = Math.abs(delta) > 180 ? 1 : 0;
  const sweep = delta >= 0 ? 1 : 0;
  return 'M '+x0.toFixed(2)+' '+y0.toFixed(2)+' A '+r+' '+r+' 0 '+largeArc+' '+sweep+' '+x1.toFixed(2)+' '+y1.toFixed(2);
}
/* نشانگرِ زاویهٔ چرخشِ پژواک: به‌جای کلماتِ فنیِ «ساعتگرد»/«پادساعتگرد»
   که خیلی‌ها معنی‌شان را نمی‌دانند، یک کمانِ رنگی با فلش رسم می‌شود که
   خودش دقیقاً نشان می‌دهد شکل باید چقدر و به کدام‌طرف بچرخد — همان‌طور
   که فلش را می‌بینی، شکل را همان‌طور بچرخان و بکش. برای شکل‌های کاملاً
   متقارن (مثل دایرهٔ ساده) که چرخش هیچ اثری روی نتیجه ندارد، به‌جایش
   همین موضوع را با متنِ ساده توضیح می‌دهد. */
/* آرایه‌ی نقاط نرمال‌شده‌ی یک شکل را به رشته‌ی «d» یک پث SVG تبدیل می‌کند
   (روی همان سیستم صفر تا یک که خود نقاط در آن تعریف شده‌اند)، تا بشود
   دقیقاً همان شکلی که در بوم اصلی نقطه‌چین است را داخل آیکون کوچک
   نشانگر چرخش هم رسم کرد. */
function shapeToPathD(shape){
  return shape.map(stroke=>
    stroke.map((p,i)=> (i===0?'M ':'L ')+p.x.toFixed(4)+' '+p.y.toFixed(4)).join(' ')
  ).join(' ');
}
function updateRotationBadge(){
  const badge = document.getElementById('rotationBadge');
  const kind = modeKind();
  if(kind!=='echo'){ badge.classList.remove('show'); return; }
  const lvl = currentLevel();
  const groupEl = document.getElementById('rotMiniGroup');
  const pathEl = document.getElementById('rotMiniPath');
  const dotEl = document.getElementById('rotMiniStart');
  const textWrap = document.getElementById('rotText');

  /* پیش‌نمایش داخل آیکون همیشه خود شکل نقطه‌چین سمت راست است -- همان
     چیزی که بازیکن روی صفحه هم می‌بیند -- تا نقطه‌به‌نقطه با هم یکی
     باشند و گیج‌کننده نباشند. نقطه‌ی سفید هم دقیقاً روی اولین نقطه‌ی
     همان شکل (جایی که باید کشیدنش شروع شود) قرار می‌گیرد. */
  const previewShape = lvl.rightGuide;
  pathEl.setAttribute('d', shapeToPathD(previewShape));
  const startPt = previewShape[0][0];
  dotEl.setAttribute('cx', startPt.x);
  dotEl.setAttribute('cy', startPt.y);
  badge.classList.toggle('crossed', !!lvl.crossed);

  /* در پنج مرحله‌ی آموزشی اول، خود سمت چپ هم یک راهنمای نقطه‌چین کامل
     دارد (با نقطه‌ی شروع چشمک‌زن خودش -- رجوع کنید به drawStartMarker)،
     پس اینجا لازم نیست چرخش را توضیح بدهیم -- فقط بازیکن را به همان
     نقطه و همان خط‌چین راهنمایی می‌کنیم تا دنبالش کند. */
  if(currentLevelIndex < LEFT_GUIDE_TUTORIAL_LEVELS){
    groupEl.style.setProperty('--target','0deg');
    badge.classList.add('frozen');
    textWrap.innerHTML = '<span class="rot-line1">تو سمت آبی (چپ) یه نقطه‌ی سفید چشمک‌زن می‌بینی -- از همون‌جا شروع کن و خط‌چین آبی رو با انگشتت دنبال کن</span>';
    badge.classList.add('show');
    return;
  }
  badge.classList.remove('frozen');

  if(lvl.rotationInvariant){
    groupEl.style.setProperty('--target','0deg');
    textWrap.innerHTML = lvl.crossed
      ? '<span class="rot-line1">این شکل چرخش نمی‌خواد؛ فقط از توی آینه ببینش (چپ و راستش عوض بشه) و دقیقاً همونو بکش</span>'
      : '<span class="rot-line1">این شکل چرخش نمی‌خواد؛ دقیقاً همینی که تو نقطه‌چین طلایی سمت راست می‌بینی رو بکش</span>';
    badge.classList.add('show');
    return;
  }

  /* زاویه‌ای که خود بازیکن باید به شکل نقطه‌چین راست بدهد تا شکل درست
     سمت چپ به دست بیاید؛ دقیقاً معکوس چرخش خود پژواک است. این زاویه
     هم به‌صورت عدد نوشته می‌شود و هم به همان اندازه، خود شکل داخل
     آیکون می‌چرخد (رجوع کنید به کی‌فریم rotHandCycle در CSS) -- کار
     بازیکن دیدن حالت نهایی و تکرار همان با انگشتش است. */
  const compAngle = -(lvl.rotation||0);
  const dirWord = compAngle >= 0 ? 'راست' : 'چپ';
  const dirGlyph = compAngle >= 0 ? '↻' : '↺';
  const degTxt = toFa(Math.round(Math.abs(compAngle)))+' درجه';
  groupEl.style.setProperty('--target', compAngle+'deg');

  textWrap.innerHTML = lvl.crossed
    ? '<span class="rot-line1">شکل نقطه‌چین راست رو اول از توی آینه ببین (چپ و راستش عوض بشه)، بعد '+degTxt+' بچرخونش به '+dirWord+' '+dirGlyph+' -- نتیجه رو تو سمت چپ بکش</span>'
    : '<span class="rot-line1">شکل نقطه‌چین راست رو '+degTxt+' بچرخون به '+dirWord+' '+dirGlyph+' -- نتیجه رو تو سمت چپ بکش (دقیقاً مثل شکلی که تو دایره چرخید)</span>';
  badge.classList.add('show');
}
function updateHUD(){
  if(currentScreen!==SCREEN.PLAYING || !attempt) return;
  document.getElementById('hudLevelLabel').textContent = 'مرحله '+toFa(currentLevelIndex+1)+' / '+toFa(getLevels().length);
  document.getElementById('levelHint').textContent = currentLevel().name;
  updateRotationBadge();
  const kind = modeKind();
  const timerEl = document.getElementById('hudTimer');
  const fillEl = document.getElementById('inkGaugeFill');

  if(kind==='echo'){
    const elapsed = attempt.pausedAt ? (attempt.pausedAt-attempt.startTime) : (nowMs()-attempt.startTime);
    timerEl.textContent = fmtTime(elapsed);
    const remain = attempt.inkLimit>0 ? clamp(1-(attempt.inkUsed/attempt.inkLimit), 0, 1) : 1;
    fillEl.style.width = (remain*100)+'%';
    fillEl.classList.toggle('low', remain < 0.18);
  } else if(kind==='memory'){
    const m = attempt.memory;
    if(m.phase==='memorize'){
      const secs = Math.max(0,(m.phaseUntil-nowMs())/1000);
      timerEl.textContent = 'به‌خاطر بسپار… '+toFa(secs.toFixed(1));
      fillEl.style.width = (clamp((m.phaseUntil-nowMs())/currentLevel().memorizeMs,0,1)*100)+'%';
      fillEl.classList.remove('low');
    } else {
      const elapsed = attempt.pausedAt ? (attempt.pausedAt-(m.drawStartTime||attempt.startTime)) : (nowMs()-(m.drawStartTime||attempt.startTime));
      timerEl.textContent = fmtTime(elapsed);
      const remain = attempt.inkLimit>0 ? clamp(1-(attempt.inkUsed/attempt.inkLimit), 0, 1) : 1;
      fillEl.style.width = (remain*100)+'%';
      fillEl.classList.toggle('low', remain < 0.18);
    }
  } else if(kind==='dots'){
    const d = attempt.dots;
    timerEl.textContent = toFa(d.hits)+' / '+toFa(d.total);
    fillEl.style.width = (clamp(d.idx/d.total,0,1)*100)+'%';
    fillEl.classList.toggle('low', d.missed.length>0 && (d.missed.length/(d.idx||1))>0.3);
  } else if(kind==='trail'){
    const tr = attempt.trail;
    const pct = Math.round((tr.liveAccuracy||0)*100);
    timerEl.textContent = tr.started ? '٪'+toFa(pct) : '—';
    fillEl.style.width = pct+'%';
    fillEl.classList.toggle('low', pct<35);
  } else if(kind==='duo'){
    const d = attempt.duo, lvl = currentLevel();
    const starts = [d.leftStartTime, d.rightStartTime].filter(Boolean);
    const startedAt = starts.length ? Math.min(...starts) : attempt.startTime;
    const elapsed = attempt.pausedAt ? (attempt.pausedAt-startedAt) : (nowMs()-startedAt);
    timerEl.textContent = fmtTime(Math.max(0,elapsed));
    /* نوارِ بالای صفحه حالا میانگینِ جوهرِ باقی‌ماندهٔ دو دست را نشان
       می‌دهد (نه فقط تعدادِ ضربه‌ها) -- همان چیزی که واقعاً محدودیتِ
       تازه‌اضافه‌شده را کنترل می‌کند. */
    const leftRemain = d.leftInkLimit>0 ? clamp(1-(d.leftInkUsed/d.leftInkLimit), 0, 1) : 1;
    const rightRemain = d.rightInkLimit>0 ? clamp(1-(d.rightInkUsed/d.rightInkLimit), 0, 1) : 1;
    fillEl.style.width = (((leftRemain+rightRemain)/2)*100)+'%';
    fillEl.classList.toggle('low', Math.min(leftRemain,rightRemain)<0.22);
  } else if(kind==='chain'){
    const c = attempt.chain, lvl = currentLevel();
    const elapsed = attempt.pausedAt ? (attempt.pausedAt-attempt.startTime) : (nowMs()-attempt.startTime);
    timerEl.textContent = fmtTime(elapsed);
    fillEl.style.width = (clamp(c.curIdx/lvl.strokesRequired,0,1)*100)+'%';
    fillEl.classList.remove('low');
  } else if(kind==='fill'){
    const lvl = currentLevel(), f = attempt.fill, fillMask = getFillMask(lvl);
    const coverage = clamp(f.paintedInsideCount/fillMask.insideCount, 0, 1);
    timerEl.textContent = '٪'+toFa(Math.round(coverage*100));
    fillEl.style.width = (coverage*100)+'%';
    fillEl.classList.toggle('low', f.paintedOutsideCount > fillMask.insideCount*0.3);
  } else if(kind==='wind'){
    const elapsed = attempt.pausedAt ? (attempt.pausedAt-attempt.startTime) : (nowMs()-attempt.startTime);
    timerEl.textContent = fmtTime(elapsed);
    const remain = attempt.inkLimit>0 ? clamp(1-(attempt.inkUsed/attempt.inkLimit), 0, 1) : 1;
    fillEl.style.width = (remain*100)+'%';
    fillEl.classList.toggle('low', remain < 0.18);
  }
}
function renderCompleteScreen(stars, accuracy){
  const panel = document.getElementById('completePanel');
  panel.querySelector('.complete-title').textContent = (currentLevelIndex+1>=getLevels().length) ? 'پایان! تبریک' : 'مرحله کامل شد!';
  panel.querySelector('.complete-stars').innerHTML = starIcons(stars);
  const label = modeDefById(currentModeId).accuracyLabel || 'دقت';
  panel.querySelector('.complete-accuracy').textContent = label+': ٪'+toFa(Math.round(accuracy));
  document.getElementById('btnNextLevel').style.display = (currentLevelIndex+1<getLevels().length) ? 'flex' : 'none';
}

/* =====================================================================
   بخش ۱۴: حلقهٔ اصلیِ بازی (Main Loop)
   بر پایهٔ delta-time، نه فرض‌ثابتِ ۶۰FPS، تا روی نمایشگرهای با نرخ
   تازه‌سازیِ متفاوت (۶۰/۹۰/۱۲۰هرتز) هم رفتار یکسان و روان داشته باشد.
   ===================================================================== */
let lastFrameTime = nowMs();
function frame(){
  const t = nowMs();
  const dt = Math.min(64, t-lastFrameTime);
  lastFrameTime = t;

  updateAmbientParticles(dt);
  updateSparkBursts(dt);

  if(currentScreen===SCREEN.PLAYING && attempt && !activeModal && !attempt.finished){
    const kind = modeKind();
    if(kind==='echo'){
      processEchoQueue(t);
      const lvlEcho = currentLevel();
      /* باگ‌فیکس: قبلاً همین‌که یک ضربه (از چند ضربهٔ لازم) تمام می‌شد و
         انگشت بلند می‌شد، بلافاصله امتیازدهی و پایانِ مرحله انجام می‌شد؛
         حتی اگر شکل چند ضربه‌ای بود و بازیکن هنوز باقیِ ضربه‌ها را نکشیده
         بود. حالا تا وقتی تعداد ضربه‌های واقعاً کشیده‌شده کمتر از تعداد
         ضربه‌های لازمِ همان مرحله باشد، هیچ ارزیابی‌ای انجام نمی‌شود. */
      if(!attempt.isDrawing && attempt.echoQueue.length===0 && attempt.strokesUsed>0 && attempt.strokesUsed>=lvlEcho.strokesRequired){
        const leftAcc = scoreSide(lvlEcho.leftTarget, attempt.liveStrokes, lvlEcho.tolerance);
        const rightAcc = scoreSide(lvlEcho.rightGuide, attempt.rightStrokes, lvlEcho.tolerance);
        const overall = (leftAcc+rightAcc)/2;
        /* باگ‌فیکس: قبلاً فقط میانگینِ دو طرف با آستانه مقایسه می‌شد،
           پس اگر یک طرف تقریباً کامل و درست کشیده می‌شد، طرفِ دیگر
           می‌توانست حتی یک شکلِ کاملاً بی‌ربط باشد و بازیکن بازهم -- به
           لطفِ میانگینِ بالا -- می‌برد. حالا هر دو طرف باید جدا‌جدا هم به
           حداقلِ لازم برسند، نه فقط میانگین‌شان. */
        if(leftAcc >= MIN_PASS_ACCURACY && rightAcc >= MIN_PASS_ACCURACY) completeLevel(leftAcc, rightAcc, overall);
      }
    } else if(kind==='memory'){
      updateMemoryPhase(t);
      const lvlMem = currentLevel();
      /* همان باگ‌فیکسِ بالا، برای «رد حافظه»: قبلاً با برداشتنِ انگشت از
         روی صفحه -- حتی وسطِ کشیدنِ یک شکلِ چندضربه‌ای و بدونِ تمام کردنِ
         آن -- بازی فوراً امتیاز می‌داد و بازیکن را از مرحله بیرون می‌برد
         (به صفحهٔ «مرحله کامل شد» می‌رفت). حالا صبر می‌کند تا دستِ‌کم به
         تعداد ضربه‌های لازمِ شکل، ضربه زده شود. */
      if(lvlMem && attempt.memory.phase==='draw' && !attempt.isDrawing && attempt.strokesUsed>0 && attempt.strokesUsed>=lvlMem.strokesRequired){
        const acc = scoreSide(lvlMem.shape, attempt.liveStrokes, lvlMem.tolerance);
        if(acc >= MIN_PASS_ACCURACY) completeMemoryLevel(acc);
      }
    } else if(kind==='dots'){
      updateDotsTimer(t);
    } else if(kind==='trail'){
      updateTrail(dt, t);
    } else if(kind==='duo'){
      const dLvl = currentLevel(), d = attempt.duo;
      if(!d.leftDrawing && !d.rightDrawing && d.leftStrokesUsed>0 && d.rightStrokesUsed>0 &&
         d.leftStrokesUsed>=dLvl.leftStrokesRequired && d.rightStrokesUsed>=dLvl.rightStrokesRequired){
        const leftAcc = scoreSide(dLvl.leftShape, d.leftStrokes, dLvl.tolerance);
        const rightAcc = scoreSide(dLvl.rightShape, d.rightStrokes, dLvl.tolerance);
        const overall = (leftAcc+rightAcc)/2;
        /* همان باگ‌فیکسِ حالتِ echo: هر دو دست باید جدا‌جدا هم به حداقلِ
           لازم برسند، نه فقط میانگین‌شان -- وگرنه یک دست می‌توانست کاملاً
           بی‌ربط بکشد و با دستِ خوبِ طرفِ دیگر جبران شود. */
        if(leftAcc >= MIN_PASS_ACCURACY && rightAcc >= MIN_PASS_ACCURACY) finishDuoLevel(leftAcc, rightAcc, overall);
      }
    } else if(kind==='chain'){
      const cLvl = currentLevel(), c = attempt.chain;
      if(!attempt.isDrawing && c.curIdx>=cLvl.strokesRequired){
        const acc = scoreSide(cLvl.shape, attempt.liveStrokes, cLvl.tolerance);
        if(acc >= MIN_PASS_ACCURACY) completeChainLevel(acc);
      }
    } else if(kind==='fill'){
      const fLvl = currentLevel(), f = attempt.fill;
      if(!attempt.isDrawing && f.paintedInsideCount>0){
        const fillMask = getFillMask(fLvl);
        const coverage = f.paintedInsideCount/fillMask.insideCount;
        if(coverage >= (fLvl.coverageTarget||0.75)) finishFillLevel();
      }
    } else if(kind==='wind'){
      const wLvl = currentLevel();
      if(!attempt.isDrawing && attempt.strokesUsed>0 && attempt.strokesUsed>=wLvl.strokesRequired){
        const acc = scoreSide(wLvl.shape, attempt.liveStrokes, wLvl.tolerance);
        if(acc >= MIN_PASS_ACCURACY) completeWindLevel(acc);
      }
    }
    updateHUD();
  }

  render();
  requestAnimationFrame(frame);
}

/* =====================================================================
   بخش ۱۵ب: تبلیغات تپسل و اشتراک VIP
   نمایشِ واقعیِ تبلیغ سمتِ نیتیو (MainActivity.java) انجام می‌شود؛ این‌جا
   فقط تصمیم می‌گیریم "الان باید تبلیغ نشان داده شود یا نه" و اگر بله،
   از طریقِ پلِ WebView (window.AndroidAds) به اندروید خبر می‌دهیم.
   داخلِ مرورگرِ معمولی (بدونِ AndroidAds) کاملاً بی‌خطر و بدون اثر است.
   ===================================================================== */
const ADS_SHOW_PROBABILITY = 0.35; // ۳۵٪ احتمالِ نمایش، هر بار مرحله‌ای برده یا باخته می‌شود
let vipActive = false;

function isNativeApp(){
  return !!(window.AndroidAds && typeof window.AndroidAds.showInterstitial === 'function');
}
function loadVipState(){
  try{ vipActive = localStorage.getItem('echoPaintVIP') === '1'; }catch(e){ vipActive = false; }
  updateVipButtonVisibility();
}
function setVipActive(active){
  vipActive = !!active;
  try{ localStorage.setItem('echoPaintVIP', vipActive ? '1' : '0'); }catch(e){}
  updateVipButtonVisibility();
}
function updateVipButtonVisibility(){
  const btn = document.getElementById('btnVip');
  if(btn) btn.style.display = vipActive ? 'none' : '';
}
/* هم موقعِ بردنِ مرحله و هم موقعِ باختن/تمام‌شدنِ جوهر صدا زده می‌شود:
   با احتمالِ ۳۵٪ (و فقط اگر کاربر VIP نخریده باشد) از اندروید می‌خواهیم
   یک تبلیغِ میان‌صفحه‌ای از تپسل نشان دهد. */
function maybeShowAd(){
  if(vipActive || !isNativeApp()) return;
  if(Math.random() >= ADS_SHOW_PROBABILITY) return;
  try{ window.AndroidAds.showInterstitial(); }catch(e){}
}
function openVipModal(){ document.getElementById('vipOverlay').classList.add('open'); }
function closeVipModal(){ document.getElementById('vipOverlay').classList.remove('open'); }
/* خریدِ VIP فعلاً یک placeholder است (بلافاصله فعال می‌شود) تا کلِ
   جریان قابلِ تست باشد. قبلِ انتشار در بازار باید این تابع به سیستمِ
   پرداختِ همان بازار (کافه‌بازار/مایکت/گوگل‌پلی) وصل شود. */
function purchaseVip(){
  setVipActive(true);
  closeVipModal();
}
function restoreVip(){
  if(vipActive) closeVipModal();
  else alert('خریدِ قبلی‌ای پیدا نشد.');
}
loadVipState();
document.getElementById('btnVip').addEventListener('click', ()=>{ SFX.tap(); openVipModal(); });
document.getElementById('btnVipClose').addEventListener('click', ()=>{ SFX.tap(); closeVipModal(); });
document.getElementById('btnVipBuy').addEventListener('click', purchaseVip);
document.getElementById('btnVipRestore').addEventListener('click', restoreVip);

/* =====================================================================
   بخش ۱۵: مقداردهیِ اولیهٔ بازی (Init)
   ===================================================================== */
function init(){
  resizeCanvas();
  initAmbientParticles();
  updateSoundIcon();
  setScreen(SCREEN.MENU);
  requestAnimationFrame(frame);
}
init();

})();
</script>
